# Tool 07 — Web trình chiếu: trang tất định theo khung của brief (1080×1920 cho Shorts/TikTok/Reels) dựng từ timeline + storyboard + hình (thiết kế: docs/superpowers/specs/2026-11-28-tool-trinh-chieu-design.md).
# Trang này là bộ dựng duy nhất: Tool 08 chụp đúng trang này thành khung hình.
stage: presentation
version: 2
title: Kiểm duyệt web trình chiếu
artifacts: [07_presentation, 00_brief/brief.yaml, 05_timeline/timeline.yaml, 02_design/storyboard.yaml, 06_animation/assets.yaml, '@platforms']
items:
  - id: PRS-A01
    group: Cấu trúc
    title: presentation.json khớp đầu vào (timeline, storyboard, hình, giọng)
    severity: chan
    method: auto
    check: presentation_input_hash
  - id: PRS-A02
    group: Cấu trúc
    title: Mọi hình có trong assets/ và trùng hash với 06_animation
    severity: chan
    method: auto
    check: presentation_assets
  - id: PRS-A03
    group: Nhận diện
    title: Font nhận diện có file, có giấy phép và trình duyệt nạp được
    severity: chan
    method: auto
    check: presentation_fonts
  - id: PRS-A04
    group: Kỹ thuật
    title: Dựng thử không lỗi JS/console, đúng khung của brief, không khung đen hay trống
    severity: chan
    method: auto
    check: presentation_render
  - id: PRS-A05
    group: Kỹ thuật
    title: Tất định — tua xuôi, tua ngược cho ảnh trùng hash điểm ảnh
    severity: chan
    method: auto
    check: presentation_deterministic
  - id: PRS-A06
    group: Hiển thị
    title: Chữ không tràn box và nằm trong vùng an toàn của các nền tảng đã chọn (đo trong DOM)
    severity: nghiem_trong
    method: auto
    check: presentation_text_fit
  - id: PRS-A07
    group: Chuyển động
    title: Mọi vòng lặp và chuyển động lớp có công thức; cảnh có loop phải chạy bằng lớp
    severity: nghiem_trong
    method: auto
    check: presentation_motion
  - id: PRS-A08
    group: Cấu trúc
    title: Tờ kiểm và tờ ảnh khung mốc khớp bản dựng hiện tại
    severity: chan
    method: auto
    check: presentation_check_in_sync
  - id: PRS-C01
    group: Bố cục
    title: Bố cục từng khung hình khớp storyboard (vị trí, thứ tự lớp, nền)
    severity: chan
    method: ai
    guidance: Đối chiếu check/contact.png với 02_design/frames/*.png từng mã khung hình. Xem thêm check/contact_ui.png (chồng giao diện nền tảng che nhiều nhất) — Khỉ, chữ, nút không nằm dưới vùng che. Ghi khung lệch bố cục hay thiếu phần tử.
  - id: PRS-C02
    group: Chuyển cảnh
    title: Chuyển cảnh mượt, đúng loại đã khai
    severity: nghiem_trong
    method: ai
    guidance: Xem các khung vai 'transition' trong contact.png và mở trang ở chế độ xem để tua qua từng chỗ chuyển cảnh.
  - id: PRS-C03
    group: Chuyển động
    title: Chuyển động tự nhiên, khớp lời đọc
    severity: chan
    method: ai
    guidance: Chủ dự án chấm mục này. Người duyệt mở 07_presentation/index.html (chế độ xem, có tiếng), bật lớp phủ từng nền tảng ở ô 'giao diện', xem hết một lượt. Ghi mốc giây chỗ hình đi trước/sau lời hoặc chuyển động máy móc.
  - id: PRS-C04
    group: Hiển thị
    title: Chữ đúng font nhận diện, đọc rõ, không lỗi dấu tiếng Việt
    severity: chan
    method: ai
    guidance: Xem các khung có chữ ở cỡ thật. Dấu chồng (ặ, ổ, ữ…) không vỡ, không rơi về font dự phòng.
  - id: PRS-C05
    group: Nhận diện
    title: Linh vật và thương hiệu đúng luật kênh
    severity: nghiem_trong
    method: ai
    guidance: Linh vật đúng 2–3 lần phản ứng + kết video, không che nội dung chính; màu nền/chữ theo brand; không méo PNG.
