# Tool 4 — Hoạt ảnh 2D (SVG/CSS/Canvas/Lottie). GIF chỉ dùng để xem trước.
stage: animation
version: 4
title: Kiểm duyệt hoạt ảnh 2D
artifacts: [06_animation, 02_design/storyboard.yaml, 05_timeline/timeline.yaml]
items:
  - id: ANI-A01
    group: Cấu trúc
    title: Đủ hình cho mọi asset của storyboard, mỗi hình có nguồn và giấy phép
    severity: chan
    method: auto
    check: animation_assets_complete
    params: {path: 06_animation/assets.yaml, storyboard: 02_design/storyboard.yaml}
  - id: ANI-A02
    group: Kỹ thuật
    title: SVG hợp lệ — có viewBox, không ảnh/script/nguồn ngoài, chữ đúng font
    severity: chan
    method: auto
    check: svg_valid
    params: {path: 06_animation/assets.yaml, brief: 00_brief/brief.yaml}
  - id: ANI-A03
    group: Nhận diện
    title: Icon/chữ/nút chỉ dùng màu nhận diện (≤ 4 màu); cảnh chỉ dùng bảng màu cảnh đã duyệt (≤ 16 màu)
    severity: nghiem_trong
    method: auto
    check: svg_palette
    params: {path: 06_animation/assets.yaml, brief: 00_brief/brief.yaml, max_colors: 4, max_scene_colors: 16}
    notes: "Chủ dự án (Vinakiwata) DUYỆT ngày 28/11/2026: cảnh minh hoạ (asset kind=scene) dùng màu tự nhiên theo brand.scene_colors; icon, chữ, nút vẫn chỉ dùng 4 màu nhận diện."
  - id: ANI-A04
    group: Kỹ thuật
    title: Có đủ các lớp tách để làm chuyển động
    severity: chan
    method: auto
    check: svg_layers
    params: {path: 06_animation/assets.yaml}
  - id: ANI-A05
    group: An toàn thị giác
    title: Không nhấp nháy nhanh — chu kỳ sáng/tối ≥ 0,4 giây (WCAG 2.3.1)
    severity: chan
    method: auto
    check: animation_flash_safety
    params: {path: 05_timeline/timeline.yaml, min_period_s: 0.4}
  - id: ANI-A06
    group: Cấu trúc
    title: Tờ xem trước khớp các file SVG hiện tại
    severity: nhe
    method: auto
    check: animation_preview_in_sync
    params: {path: 06_animation/assets.yaml, manifest: 06_animation/preview_manifest.json}
  - id: ANI-A07
    group: Thương hiệu
    title: Linh vật PNG nền trong suốt, trùng bản gốc của kênh, không phóng to quá cỡ file
    severity: nghiem_trong
    method: auto
    check: mascot_png
    params: {path: 06_animation/assets.yaml, brief: 00_brief/brief.yaml, storyboard: 02_design/storyboard.yaml}
    notes: "Chủ dự án (Vinakiwata) DUYỆT ngày 28/11/2026: kênh Khỉ Khám Phá — Khỉ phản ứng ở điểm nhấn và có mặt ở cảnh kết; dùng PNG gốc của bộ nhận diện."
  - id: ANI-C01
    group: Độ phủ
    title: Mọi hoạt ảnh trong storyboard đã có, đúng mã cảnh
    severity: chan
    method: ai
    guidance: Đối chiếu 02_design/storyboard.yaml với 06_animation/assets.yaml. Liệt kê cái thiếu.
  - id: ANI-C02
    group: Chất lượng hình
    title: Không lỗi hình — không vỡ nét, chi tiết thừa, vật thể xuyên nhau, hình méo
    severity: chan
    method: ai
    guidance: Xem assets_preview.png (và mở từng SVG ở kích thước lớn khi cần). Ghi tên asset và lỗi.
  - id: ANI-C03
    group: Chất lượng chuyển động
    title: Chuyển động tự nhiên (easing, có đà, có quán tính), không tuyến tính cứng
    severity: nghiem_trong
    method: ai
    guidance: Áp dụng nguyên lý hoạt hình (ease-in/out, anticipation, follow-through, squash & stretch khi hợp). Ghi asset chuyển động "máy móc".
  - id: ANI-C04
    group: Truyền đạt
    title: Hoạt ảnh dễ hiểu, không gây hiểu sai hay rối mắt
    severity: chan
    method: ai
    guidance: Một chuyển động chính mỗi lúc. Hướng chuyển động dẫn mắt tới điểm nhìn chính.
  - id: ANI-C05
    group: Nhận diện
    title: Đúng phong cách nét trong bộ nhận diện (màu đã đo tự động)
    severity: nghiem_trong
    method: ai
    guidance: Xem assets_preview.png. Nét tròn, phẳng, bóng đổ nhẹ, mức chi tiết đồng đều giữa các hình; hình nào lệch phong cách thì ghi lại.
  - id: ANI-C06
    group: Kỹ thuật
    title: Vector hoặc độ phân giải đủ cho 1080p, nền trong suốt khi cần chồng lớp
    severity: nghiem_trong
    method: ai
    guidance: Ảnh raster phải ≥ kích thước hiển thị × 2. Không dùng GIF làm thành phẩm.
