# Tool 4 — Hoạt ảnh 2D (SVG/CSS/Canvas/Lottie). GIF chỉ dùng để xem trước.
stage: animation
version: 1
title: Kiểm duyệt hoạt ảnh 2D
artifacts: [06_animation]
items:
  - id: ANI-A01
    group: Cấu trúc
    title: Có danh mục hoạt ảnh (assets.yaml)
    severity: chan
    method: auto
    check: file_exists
    params: {paths: [06_animation/assets.yaml]}
  - id: ANI-C01
    group: Độ phủ
    title: Mọi hoạt ảnh trong storyboard đã có, đúng mã cảnh
    severity: chan
    method: ai
    guidance: Đối chiếu 02_design/storyboard.yaml với 06_animation/assets.yaml. Liệt kê cái thiếu.
  - id: ANI-C02
    group: Chất lượng hình
    title: Không lỗi hình — không vỡ nét, răng cưa, nhấp nháy, giật, vật thể xuyên nhau
    severity: chan
    method: ai
    guidance: Xem từng hoạt ảnh ở 1920×1080 và chậm 0,25×. Ghi tên asset, khung hoặc mốc thời gian lỗi.
  - id: ANI-C03
    group: Chất lượng chuyển động
    title: Chuyển động tự nhiên (easing, có đà, có quán tính), không tuyến tính cứng
    severity: nghiem_trong
    method: ai
    guidance: Áp dụng nguyên lý hoạt hình (ease-in/out, anticipation, follow-through, squash & stretch khi hợp). Ghi asset chuyển động "máy móc".
  - id: ANI-C04
    group: Truyền đạt
    title: Hoạt ảnh dễ hiểu, không gây hiểu sai hay rối mắt
    severity: chan
    method: ai
    guidance: Một chuyển động chính mỗi lúc. Hướng chuyển động dẫn mắt tới điểm nhìn chính.
  - id: ANI-C05
    group: Nhận diện
    title: Đúng màu, font, phong cách nét trong bộ nhận diện
    severity: nghiem_trong
    method: ai
    guidance: Kiểm tra mã màu trong file SVG/CSS có thuộc brand.colors không.
  - id: ANI-C06
    group: Kỹ thuật
    title: Vector hoặc độ phân giải đủ cho 1080p, nền trong suốt khi cần chồng lớp
    severity: nghiem_trong
    method: ai
    guidance: Ảnh raster phải ≥ kích thước hiển thị × 2. Không dùng GIF làm thành phẩm.
  - id: ANI-C07
    group: An toàn thị giác
    title: Không nhấp nháy nhanh (> 3 lần/giây) gây nguy cơ động kinh
    severity: chan
    method: ai
    guidance: Theo hướng dẫn WCAG 2.3.1. Ghi asset vi phạm.
  - id: ANI-C08
    group: Bản quyền
    title: Mọi hình là gốc hoặc có giấy phép ghi rõ trong assets.yaml
    severity: chan
    method: ai
    guidance: Mỗi asset có trường source và license.
