  title: USGS - Why is the ocean salty?
  url: https://www.usgs.gov/faqs/why-ocean-salty
  accessed: '2026-11-27'
- id: SRC2
  title: NOAA Ocean Service - Why is the ocean salty, but rivers flowing into it are not?
  url: https://oceanservice.noaa.gov/facts/riversnotsalty.html
  accessed: '2026-11-27'
- id: SRC3
  title: Britannica - Why Is There Fresh and Salt Water on Earth?
  url: https://www.britannica.com/story/why-is-there-fresh-and-salt-water-on-earth
  accessed: '2026-11-27'
- id: SRC4
  title: NOAA Ocean Service - Why is the ocean salty?
  url: https://oceanservice.noaa.gov/facts/whysalty.html
