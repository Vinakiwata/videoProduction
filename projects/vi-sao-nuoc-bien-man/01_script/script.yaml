meta:
  title: Vì sao nước biển lại mặn?
  language: vi
  target_duration_s: 50
  audience: Học sinh trung học và người lớn tò mò, xem trên điện thoại và máy tính
  goal: Sau khoảng 50 giây, người xem giải thích lại được vì sao biển mặn còn sông thì không (mưa hoà tan khoáng chất trong đá, sông mang muối ra biển, nước bốc hơi còn muối ở lại) và muốn xem tiếp kênh
pronunciation:
  cacbonic: các bô ních
sources:
