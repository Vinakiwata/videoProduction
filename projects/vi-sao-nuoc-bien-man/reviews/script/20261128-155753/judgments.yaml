SCR-F01:
  verdict: pass
  evidence: 'Đã kiểm lại từng khẳng định theo lời mới, đối chiếu research.md và các nguồn tra ngày 27/11:

    - S02-01 "mưa ôm theo khí cacbonic nên hơi chua": nước mưa hoà tan CO₂ thành axit cacbonic yếu (USGS, Britannica).

    - S02-02 "gặm từng chút, hoà tan khoáng chất li ti, trong đó có muối": phong hoá hoá học hoà tan khoáng chất thành ion (USGS). "Gặm" là cách nói hình ảnh, không sai bản chất.

    - S03-01 "chút muối xíu xiu, ít tới mức bạn không nếm ra": nồng độ muối trong sông rất thấp (USGS, NOAA).

    - S03-02 "sông luôn được mưa châm nước ngọt mới… biển gom muối của tất cả các dòng sông": NOAA.

    - S04-01 "muối thì không biết bay, đành ở lại": muối không bay hơi cùng nước (Britannica). Nhân hoá vui nhưng đúng.

    - S04-03 "xoay vòng hàng triệu năm, muối tích dần": NMSF, NOAA.

    - S04-04 "núi lửa và khe nứt nóng dưới đáy biển cũng thả khoáng chất": NOAA, USGS.

    - S05-01 tóm đúng 3 mắt xích.

    Không có số liệu cụ thể nào để có thể sai.'
SCR-F02:
  verdict: pass
  evidence: Mọi đoạn có khẳng định khoa học (S02-01, S02-02, S03-01, S03-02, S04-01, S04-03, S04-04) đều có source_ids, mỗi nguồn hỗ trợ đúng nội dung như ghi ở research.md (K1–K7). S01-01 (sông ngọt, biển mặn) là kiến thức phổ thông. S05-01 chỉ tóm lại các ý đã có nguồn.
SCR-F03:
  verdict: pass
  evidence: Dùng "muối" thay cho "các ion hoà tan", và bỏ chi tiết sinh vật biển dùng bớt một số ion (research.md có ghi lý do lược). Đây là đơn giản hoá được phép. Lời mới vẫn giữ đúng chuỗi nhân quả; các nhân hoá (mưa "ôm theo", "gặm", muối "không biết bay") chỉ làm vui, không đổi cơ chế. Đã tránh lỗi phổ biến "biển đang mặn thêm" bằng S04-03 "tích dần đến độ mặn như hôm nay".
SCR-L01:
  verdict: pass
  evidence: 'Đối chiếu nhóm nội dung cấm theo Luật An ninh mạng 116/2025/QH15: chỉ có nội dung địa chất, hải dương học phổ thông. Không có yếu tố chính trị, tôn giáo, bạo lực, xúc phạm.'
SCR-L02:
  verdict: pass
  evidence: Lời đọc không nhắc cá nhân, tổ chức hay sự kiện có thật nào. Các cơ quan (USGS, NOAA, Britannica, NMSF) chỉ có trong danh sách nguồn.
SCR-L03:
  verdict: na
  evidence: brief.is_advertising = false. Kịch bản không giới thiệu sản phẩm, dịch vụ hay thương hiệu nào. CTA chỉ mời đăng ký kênh của chính mình.
SCR-L04:
  verdict: pass
  evidence: Không có tên, hình ảnh hay dữ liệu người thật. Visual chỉ gồm sông, biển, đá, mây, núi lửa, nút bấm.
SCR-L05:
  verdict: na
  evidence: Nội dung khoa học tự nhiên, không có lời khuyên y tế, pháp lý hay tài chính.
SCR-P01:
  verdict: pass
  evidence: Không có nội dung nguy hiểm. Câu "ít tới mức bạn không nếm ra" nói về nước sông nói chung, không khuyến khích nếm hay uống nước sông, nước biển. Giọng dí dỏm, không chế giễu ai, không có từ thô tục. Phù hợp mọi lứa tuổi.
SCR-P02:
  verdict: pass
  evidence: Không trích tác phẩm nào. S05-02 dùng "nút đăng ký tự thiết kế" theo màu brand, không dùng logo YouTube. Mọi hình là mô tả chung. Linh vật Khỉ và logo thuộc bộ nhận diện do chủ dự án cung cấp và dùng cho kênh của chính chủ dự án, không phỏng theo nhân vật có bản quyền đã biết. Hình tạo bằng AI nên được gắn nhãn theo constraints của brief.
SCR-P03:
  verdict: pass
  evidence: Câu hỏi mở đầu "Muối ở đâu ra vậy ta?" được trả lời trọn ở S02–S04, có báo hiệu "Bật mí nè, thủ phạm đầu tiên…", và tóm lại ở S05-01. Tiêu đề "Vì sao nước biển lại mặn?" đúng nội dung. Chữ trên màn hình "Muối từ đâu ra?" khớp ý câu hỏi.
SCR-Q01:
  verdict: pass
  evidence: 'Khớp brief:

    - goal 3 mắt xích có ở S02, S03, S04-01, tóm lại ở S05-01; ý "sông thì không" ở S03-02.

    - Khán giả trung học: từ phổ thông.

    - tone mới "dí dỏm, tinh nghịch như một bạn 15 tuổi; Khỉ xưng Khỉ – gọi bạn": S01-01 "Ê bạn ơi… vậy ta?", S02-01 "Bật mí nè, thủ phạm", S03-01 "rủ nhau… xíu xiu", S04-01 "muối thì không biết bay", S05-02 "cùng Khỉ".

    - cta "Thấy hay thì đăng ký kênh, mỗi tuần cùng Khỉ khám phá một bí mật khoa học" khớp S05-02.

    - Ước tính lại theo tốc độ thật của giọng Xuân Vĩnh (4,15 âm tiết/giây, đã hiệu chỉnh): 52,6 giây so với mục tiêu 50, +5%, trong ngưỡng ±15% (SCR-A07 đạt). Giọng thật đo được 52,3 giây.'
SCR-Q02:
  verdict: pass
  evidence: 'S01-01 mở ngay bằng nghịch lý, câu "Ê bạn ơi" kéo người xem vào từ giây 0. Câu hỏi "Muối ở đâu ra vậy ta?" kết thúc ở khoảng 5,4 giây theo ước tính (giọng thật S01-01: 5,8 giây gồm cả các khoảng ngắt câu). Không chào hỏi dài.'
SCR-Q03:
  verdict: pass
  evidence: 'Mỗi cảnh một ý: S01 nghịch lý; S02 mưa lấy muối từ đá; S03 sông chở muối, vì sao sông vẫn ngọt; S04 bốc hơi giữ muối, tích qua thời gian, nguồn phụ dưới đáy biển; S05 tóm và CTA. Cầu nối: "Nước mưa chua nhẹ ấy", "Nước mưa gom về", "Mây lại mưa xuống đất", "Thêm một nguồn nữa".'
SCR-Q04:
  verdict: pass
  evidence: '"Khí cacbonic" là kiến thức lớp 8, có hình phân tử khí bay vào giọt mưa. "Hơi chua" có nhãn "axit nhẹ". "Khe nứt nóng dưới đáy biển" được vẽ ở mặt cắt S04-04. Không dùng thuật ngữ "ion", "nhiệt dịch", "độ muối".'
SCR-Q05:
  verdict: pass
  evidence: S05-01 "Tóm lại nè" tóm cả 3 mắt xích trong một câu (20 âm tiết), có biểu tượng hiện theo từng vế. S05-02 là CTA khoảng 4,0 giây (giọng thật) rồi hết.
SCR-Q06:
  verdict: pass
  evidence: 'Có 3 khoảng nghỉ: S01-02 sau câu móc, S02-03 sau đoạn đá (ý khó đầu tiên), S04-02 sau đoạn bốc hơi. Không có 3 đoạn dày thông tin mới liền nhau. Chuỗi S04-03 → S04-04 → S05-01 có S05-01 là câu tóm, không thêm thông tin mới.'
SCR-V01:
  verdict: pass
  evidence: 'Đã đọc 10 đoạn lời mới: không lỗi chính tả, dấu đúng ("thủ phạm", "khoáng chất li ti", "xíu xiu", "mặn chát", "hoà tan"). Câu đủ thành phần; câu cảm thán và câu hỏi tu từ có dấu đúng. Từ khẩu ngữ ("nè", "ta", "đó", "xíu xiu") là chủ ý theo tone kênh. Hai câu có dấu hai chấm đã đặt trong ngoặc kép trong YAML để không lỗi định dạng.'
SCR-V02:
  verdict: pass
  evidence: 'Câu dài nhất là S03-01 (21 âm tiết), có ba dấu phẩy ngắt nhịp. S04-03, S04-04, S05-01 dài 20 âm tiết, đều có dấu phẩy hoặc dấu hai chấm. Không có ký hiệu trong lời đọc. Đọc to thử: nhịp nói chuyện tự nhiên, không líu lưỡi.'
SCR-V03:
  verdict: pass
  evidence: 'Từ vay mượn duy nhất "cacbonic" khai pronunciation "các bô ních" (âm tiết rời, đúng chính tả vần -ich). Lịch sử: "các-bon-níc" bị đọc "cacbon-i-c"; "các bô níc" bị đánh vần "các bô i xê" — cả hai do chủ dự án nghe phát hiện 27–28/11; đã thêm kiểm tra tự động (SCR-A09: không gạch nối + chính tả vần sau i/ê phải ch/nh). Không có số, đơn vị, viết tắt trong lời.'
SCR-V04:
  verdict: na
  evidence: Không dùng thẻ cảm xúc nào trong 10 đoạn giọng.
SCR-D01:
  verdict: pass
  evidence: 'Mỗi visual có đối tượng, chuyển động và điều cần nhận ra. Ví dụ S02-02: hạt trắng bong khỏi đá, đánh dấu hình lập phương muối "để người xem thấy muối đến từ đá". S03-02: nhiều sông dồn chấm trắng về một biển. S04-01: mũi tên lên chỉ có nước, muối ở lại. S04-03: bộ đếm năm, biển đậm màu dần rồi dừng.'
SCR-D02:
  verdict: pass
  evidence: Lời đọc đã viết lại theo lối dí dỏm, chủ dự án đã duyệt bản nháp ngày 28/11; phải tạo lại giọng (Xuân Vĩnh +2,5 nửa cung). Mọi visual giữ nguyên và vẫn khớp ý từng câu mới. Hình vẫn làm được bằng SVG vector và PNG linh vật; không cần quay thật, không có người thật.
