SCR-F01:
  verdict: pass
  evidence: 'Đã kiểm lại từng khẳng định theo lời văn nghiêm túc, đối chiếu research.md và các nguồn tra ngày 27/11:

    - S02-01 "mưa hoà tan khí cacbonic nên hơi có tính axit": tạo axit cacbonic yếu (USGS, Britannica).

    - S02-02 "bào mòn dần và hoà tan các khoáng chất li ti, trong đó có muối": phong hoá hoá học (USGS).

    - S03-01 "lượng muối rất nhỏ, nhỏ đến mức ta không nếm ra": USGS, NOAA.

    - S03-02 "sông luôn được mưa bổ sung nước ngọt mới… biển nhận muối từ tất cả các dòng sông": NOAA.

    - S04-01 "muối không bốc hơi theo, mà ở lại trong biển": Britannica.

    - S04-03 "vòng tuần hoàn ấy lặp lại suốt hàng triệu năm, khiến muối trong biển tích tụ dần": NMSF, NOAA.

    - S04-04 "núi lửa và các khe nứt nóng dưới đáy biển cũng bổ sung thêm khoáng chất": NOAA, USGS.

    - S05-01 tóm đúng 3 mắt xích.

    Không có số liệu cụ thể.'
SCR-F02:
  verdict: pass
  evidence: Mọi đoạn có khẳng định khoa học (S02-01, S02-02, S03-01, S03-02, S04-01, S04-03, S04-04) đều có source_ids, mỗi nguồn hỗ trợ đúng nội dung như ghi ở research.md (K1–K7). S01-01 (sông ngọt, biển mặn) là kiến thức phổ thông. S05-01 chỉ tóm lại các ý đã có nguồn.
SCR-F03:
  verdict: pass
  evidence: 'Dùng "muối" thay cho "các ion hoà tan", và bỏ chi tiết sinh vật biển dùng bớt một số ion (research.md có ghi lý do lược). Đây là đơn giản hoá được phép, không sai bản chất. Lời văn nghiêm túc bỏ hết nhân hoá, nói thẳng cơ chế: hoà tan, bào mòn, bốc hơi, tích tụ.'
SCR-L01:
  verdict: pass
  evidence: 'Đối chiếu nhóm nội dung cấm theo Luật An ninh mạng 116/2025/QH15: chỉ có nội dung địa chất, hải dương học phổ thông. Không có yếu tố chính trị, tôn giáo, bạo lực, xúc phạm.'
SCR-L02:
  verdict: pass
  evidence: Lời đọc không nhắc cá nhân, tổ chức hay sự kiện có thật nào. Các cơ quan (USGS, NOAA, Britannica, NMSF) chỉ có trong danh sách nguồn.
SCR-L03:
  verdict: na
  evidence: brief.is_advertising = false. Kịch bản không giới thiệu sản phẩm, dịch vụ hay thương hiệu nào. CTA chỉ mời đăng ký kênh của chính mình.
SCR-L04:
  verdict: pass
  evidence: Không có tên, hình ảnh hay dữ liệu người thật. Visual chỉ gồm sông, biển, đá, mây, núi lửa, nút bấm.
SCR-L05:
  verdict: na
  evidence: Nội dung khoa học tự nhiên, không có lời khuyên y tế, pháp lý hay tài chính.
SCR-P01:
  verdict: pass
  evidence: Không có nội dung nguy hiểm. Không khuyến khích nếm hay uống nước sông, nước biển. Văn phong lịch sự, không tiếng lóng, không chế giễu ai. Phù hợp mọi lứa tuổi.
SCR-P02:
  verdict: pass
  evidence: Không trích tác phẩm nào. S05-02 dùng "nút đăng ký tự thiết kế" theo màu brand, không dùng logo YouTube. Mọi hình là mô tả chung. Linh vật Khỉ và logo thuộc bộ nhận diện do chủ dự án cung cấp và dùng cho kênh của chính chủ dự án, không phỏng theo nhân vật có bản quyền đã biết. Hình tạo bằng AI nên được gắn nhãn theo constraints của brief.
SCR-P03:
  verdict: pass
  evidence: Câu hỏi mở đầu "Muối trong biển từ đâu mà có?" được trả lời trọn ở S02–S04, mở bằng "Câu trả lời bắt đầu từ nước mưa", và tóm lại ở S05-01. Tiêu đề "Vì sao nước biển lại mặn?" đúng nội dung. Chữ trên màn hình "Muối từ đâu ra?" khớp ý câu hỏi.
SCR-Q01:
  verdict: pass
  evidence: 'Khớp brief:

    - goal 3 mắt xích có ở S02, S03, S04-01, tóm lại ở S05-01; ý "sông thì không" ở S03-02.

    - Khán giả trung học: từ phổ thông, có "tính axit", "khoáng chất", "tích tụ".

    - tone mới "thân thiện, rõ ràng, nghiêm túc vừa phải; gọi bạn; không tiếng lóng; Khỉ ở lời mời cuối": không còn "nè", "ta" (khẩu ngữ), "xíu xiu"; S05-02 "cùng Khỉ khám phá".

    - cta khớp S05-02 (câu mới chủ dự án duyệt 28/11: ''Đăng ký kênh để Khỉ khám phá cùng bạn thêm nhiều hiện tượng khoa học nhé!'').

    - Ước tính 50,0 giây theo tốc độ đã hiệu chỉnh lại từ giọng thật lời văn nghiêm túc (4,41 âm tiết/giây), đúng mục tiêu 50 (SCR-A07 đạt). Giọng thật đo được 49,2 giây.'
SCR-Q02:
  verdict: pass
  evidence: S01-01 mở ngay bằng nghịch lý từ giây 0 ("Sông đổ ra biển toàn là nước ngọt. Vậy mà nước biển lại mặn."). Câu hỏi "Muối trong biển từ đâu mà có?" kết thúc ở khoảng 4,8 giây (giọng thật). Không chào hỏi.
SCR-Q03:
  verdict: pass
  evidence: 'Mỗi cảnh một ý: S01 nghịch lý; S02 mưa lấy muối từ đá; S03 sông chở muối, vì sao sông vẫn ngọt; S04 bốc hơi giữ muối, tích qua thời gian, nguồn phụ dưới đáy biển; S05 tóm và CTA. Cầu nối: "Nước mưa chua nhẹ ấy", "Nước mưa gom về", "Mây lại mưa xuống đất", "Thêm một nguồn nữa".'
SCR-Q04:
  verdict: pass
  evidence: '"Khí cacbonic" là kiến thức lớp 8, có hình phân tử khí bay vào giọt mưa. "Hơi chua" có nhãn "axit nhẹ". "Khe nứt nóng dưới đáy biển" được vẽ ở mặt cắt S04-04. Không dùng thuật ngữ "ion", "nhiệt dịch", "độ muối".'
SCR-Q05:
  verdict: pass
  evidence: S05-01 tóm cả 3 mắt xích trong một câu, có biểu tượng hiện theo từng vế. S05-02 là CTA khoảng 3,4 giây (giọng thật) rồi hết.
SCR-Q06:
  verdict: pass
  evidence: 'Thêm S01-00 (im lặng 1,0 giây) ở đầu là khung thumbnail nêu câu hỏi ''Vì sao nước biển lại mặn?'' — ảnh bìa, chủ dự án yêu cầu 28/11; câu móc bằng lời vẫn bắt đầu ở giây 1,0. Có 3 khoảng nghỉ: S01-02 sau câu móc, S02-03 sau đoạn đá (ý khó đầu tiên), S04-02 sau đoạn bốc hơi. Không có 3 đoạn dày thông tin mới liền nhau. Chuỗi S04-03 → S04-04 → S05-01 có S05-01 là câu tóm, không thêm thông tin mới.'
SCR-V01:
  verdict: pass
  evidence: 'Đã đọc 10 đoạn lời mới: không lỗi chính tả, dấu đúng ("tính axit", "bào mòn", "khoáng chất li ti", "tích tụ", "bổ sung"). Câu đủ thành phần. Từ "ta" ở S03-01 dùng như đại từ chung ("ta không nếm ra"), không phải khẩu ngữ.'
SCR-V02:
  verdict: pass
  evidence: 'Câu dài nhất là S04-03 (22 âm tiết), có dấu phẩy ngắt nhịp. S03-01, S04-04, S05-01 khoảng 20–21 âm tiết, đều có dấu phẩy. Không có ký hiệu trong lời đọc. Đọc to thử: rõ ràng, không líu lưỡi.'
SCR-V03:
  verdict: pass
  evidence: 'Từ vay mượn duy nhất "cacbonic" khai pronunciation "các bô ních" (âm tiết rời, đúng chính tả vần -ich). Lịch sử: "các-bon-níc" bị đọc "cacbon-i-c"; "các bô níc" bị đánh vần "các bô i xê" — cả hai do chủ dự án nghe phát hiện 27–28/11; đã thêm kiểm tra tự động (SCR-A09: không gạch nối + chính tả vần sau i/ê phải ch/nh). Không có số, đơn vị, viết tắt trong lời.'
SCR-V04:
  verdict: na
  evidence: Không dùng thẻ cảm xúc nào trong 10 đoạn giọng.
SCR-D01:
  verdict: pass
  evidence: 'Mỗi visual có đối tượng, chuyển động và điều cần nhận ra. Ví dụ S02-02: hạt trắng bong khỏi đá, đánh dấu hình lập phương muối "để người xem thấy muối đến từ đá". S03-02: nhiều sông dồn chấm trắng về một biển. S04-01: mũi tên lên chỉ có nước, muối ở lại. S04-03: bộ đếm năm, biển đậm màu dần rồi dừng.'
SCR-D02:
  verdict: pass
