SCR-F01:
  verdict: pass
  evidence: 'Kiểm 8 khẳng định, đối chiếu research.md và kết quả tra web 2026-11-27. S02-01 mưa hoà tan CO₂ thành axit yếu (USGS, Britannica). S02-02 mưa bào mòn đá, hoà tan muối khoáng (USGS). S03-01 sông có muối nhưng rất ít (USGS, NOAA). S03-02 mưa bổ sung nước ngọt cho sông, biển gom muối mọi sông (NOAA riversnotsalty). S04-01 nước bốc hơi, muối ở lại (Britannica). S04-03 hàng triệu năm, độ mặn "như hôm nay" (NMSF; dùng thì quá khứ, khớp NOAA: nay biển không mặn thêm). S04-04 núi lửa và khe nhiệt dịch đáy biển (NOAA whysalty, USGS). Không có khẳng định sai.'
SCR-F02:
  verdict: pass
  evidence: Mọi đoạn có khẳng định khoa học (S02-01, S02-02, S03-01, S03-02, S04-01, S04-03, S04-04) đều có source_ids, mỗi nguồn hỗ trợ đúng nội dung như ghi ở research.md (K1–K7). S01-01 (sông ngọt, biển mặn) là kiến thức phổ thông. S05-01 chỉ tóm lại các ý đã có nguồn.
SCR-F03:
  verdict: pass
  evidence: Dùng "muối" thay cho "các ion hoà tan", và bỏ chi tiết sinh vật biển dùng bớt một số ion (research.md có ghi lý do lược). Đây là đơn giản hoá được phép. Đã tránh lỗi phổ biến "biển đang mặn thêm" bằng S04-03 "tích dần đến độ mặn như hôm nay".
SCR-L01:
  verdict: pass
  evidence: 'Đối chiếu nhóm nội dung cấm theo Luật An ninh mạng 116/2025/QH15: chỉ có nội dung địa chất, hải dương học phổ thông. Không có yếu tố chính trị, tôn giáo, bạo lực, xúc phạm.'
SCR-L02:
  verdict: pass
  evidence: Lời đọc không nhắc cá nhân, tổ chức hay sự kiện có thật nào. Các cơ quan (USGS, NOAA, Britannica, NMSF) chỉ có trong danh sách nguồn.
SCR-L03:
  verdict: na
  evidence: brief.is_advertising = false. Kịch bản không giới thiệu sản phẩm, dịch vụ hay thương hiệu nào. CTA chỉ mời đăng ký kênh của chính mình.
SCR-L04:
  verdict: pass
  evidence: Không có tên, hình ảnh hay dữ liệu người thật. Visual chỉ gồm sông, biển, đá, mây, núi lửa, nút bấm.
SCR-L05:
  verdict: na
  evidence: Nội dung khoa học tự nhiên, không có lời khuyên y tế, pháp lý hay tài chính.
SCR-P01:
  verdict: pass
  evidence: Không có nội dung nguy hiểm. Không khuyến khích uống nước biển (S01-01 chỉ nói "mặn chát"). Phù hợp mọi lứa tuổi.
SCR-P02:
  verdict: pass
  evidence: Không trích tác phẩm nào. S05-02 dùng "nút đăng ký tự thiết kế" theo màu brand, không dùng logo YouTube. Mọi hình là mô tả chung.
SCR-P03:
  verdict: pass
  evidence: Câu hỏi mở đầu "Muối từ đâu ra?" được trả lời trọn ở S02–S04 và tóm lại ở S05-01. Tiêu đề "Vì sao nước biển lại mặn?" đúng nội dung.
SCR-Q01:
  verdict: pass
  evidence: 'Khớp brief: goal 3 mắt xích có ở S02, S03, S04-01 và tóm ở S05-01; "sông thì không" ở S03-02; khán giả trung học (từ phổ thông); tone xưng mình–gọi bạn (S05-02); CTA ở S05-02. Thời lượng ước theo tốc độ giọng thật 4,43 âm tiết/giây: 48,7 giây so với mục tiêu 50 giây (−2,6%).'
SCR-Q02:
  verdict: pass
  evidence: S01-01 mở bằng nghịch lý từ giây 0; câu hỏi "Muối từ đâu ra?" kết thúc ở ~4,1 giây (giọng thật). Không chào hỏi.
SCR-Q03:
  verdict: pass
  evidence: 'Mỗi cảnh một ý: S01 nghịch lý; S02 mưa lấy muối từ đá; S03 sông chở muối, vì sao sông vẫn ngọt; S04 bốc hơi giữ muối, tích qua thời gian, nguồn phụ dưới đáy biển; S05 tóm và CTA. Cầu nối: "Nước mưa chua nhẹ ấy", "Nước mưa gom về", "Mây lại mưa xuống đất", "Thêm một nguồn nữa".'
SCR-Q04:
  verdict: pass
  evidence: '"Khí cacbonic" là kiến thức lớp 8, có hình phân tử khí bay vào giọt mưa. "Hơi chua" có nhãn "axit nhẹ". "Khe nứt nóng dưới đáy biển" được vẽ ở mặt cắt S04-04. Không dùng thuật ngữ "ion", "nhiệt dịch", "độ muối".'
SCR-Q05:
  verdict: pass
  evidence: S05-01 tóm cả 3 mắt xích trong một câu, có biểu tượng hiện theo từng vế. S05-02 là CTA 5,4 giây rồi hết.
SCR-Q06:
  verdict: pass
  evidence: 'Có 3 khoảng nghỉ: S01-02 sau câu móc, S02-03 sau đoạn đá (ý khó đầu tiên), S04-02 sau đoạn bốc hơi. Không có 3 đoạn dày thông tin mới liền nhau. Chuỗi S04-03 → S04-04 → S05-01 có S05-01 là câu tóm, không thêm thông tin mới.'
SCR-V01:
  verdict: pass
  evidence: 'Đọc 10 đoạn giọng: không lỗi chính tả, dấu đúng ("hoà tan", "bào mòn", "khoáng chất li ti", "mặn chát", "bổ sung"), câu đủ thành phần. S04-04 dùng dấu phẩy sau "Thêm một nguồn nữa", vẫn chấp nhận được trong văn nói.'
SCR-V02:
  verdict: pass
  evidence: Câu dài nhất là S02-02 và S04-03 (23 âm tiết), đều có dấu phẩy ngắt nhịp. Không có ký hiệu trong lời đọc (mũi tên chỉ nằm trong visual và on_screen_text). Đọc thành tiếng trôi chảy. Với giọng Hải Đăng đo thật 4,4 âm tiết/giây (chủ dự án chọn giữ tốc độ gốc), câu dài nhất ~5,2 giây.
SCR-V03:
  verdict: pass
  evidence: 'Từ vay mượn duy nhất "cacbonic" khai pronunciation "các bô ních" (âm tiết rời, đúng chính tả vần -ich). Lịch sử: "các-bon-níc" bị đọc "cacbon-i-c"; "các bô níc" bị đánh vần "các bô i xê" — cả hai do chủ dự án nghe phát hiện 27–28/11; đã thêm kiểm tra tự động (SCR-A09: không gạch nối + chính tả vần sau i/ê phải ch/nh). Không có số, đơn vị, viết tắt trong lời.'
SCR-V04:
  verdict: na
  evidence: Không dùng thẻ cảm xúc nào trong 10 đoạn giọng.
SCR-D01:
  verdict: pass
  evidence: 'Mỗi visual có đối tượng, chuyển động và điều cần nhận ra. Ví dụ S02-02: hạt trắng bong khỏi đá, đánh dấu hình lập phương muối "để người xem thấy muối đến từ đá". S03-02: nhiều sông dồn chấm trắng về một biển. S04-01: mũi tên lên chỉ có nước, muối ở lại. S04-03: bộ đếm năm, biển đậm màu dần rồi dừng.'
SCR-D02:
  verdict: pass
  evidence: Kịch bản không đổi từ lần duyệt trước; chỉ brief đổi brand.style và thêm scene_colors (28/11/2026). Mọi hình trong visual — sông, biển, đá, giọt mưa, phân tử, mây, mặt trời, núi lửa mặt cắt, bản đồ, nút bấm — vẫn vẽ được bằng 2D vector. Theo style mới, cảnh (sông có núi và cây, bãi biển, đá, đáy biển) vẽ phẳng bằng màu tự nhiên, icon giữ 4 màu nhận diện. Không cần quay thật, không có người. Riêng visual S05-02 ghi nền xanh đậm 0B3D91 vẫn đúng, vì khung CTA không phải cảnh.
