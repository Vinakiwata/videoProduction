DSN-C02:
  verdict: pass
  evidence: 'Khung dọc 1080×1920 (chủ dự án chọn 28/11/2026). Đã ghép thử bằng hình thật (SVG qua rsvg-convert, PNG Khỉ gốc, chữ Be Vietnam Pro + tấm nền) 7 khung nền xanh: S01-01-b, S02-01-a, S04-01-a, S04-03-b, S05-01-a, S05-02-a, kèm khung vùng an toàn đỏ (220/461/65/173 px). Các khung có cảnh phủ kín sẽ ghép lại bằng cảnh dọc ở cổng 06. Mỗi khung có một điểm nhìn chính, nằm trong vùng an toàn: S01-01-b/S01-02-a (bố cục chủ dự án chọn 28/11/2026 sau khi xem ảnh trước/sau): tiêu đề hai dòng ''Sông ngọt, biển mặn?'' ở trên làm câu móc, hai cốc to đặt cạnh nhau ở giữa để so sánh trực tiếp, Khỉ thắc mắc ở dưới giữa nhìn lên — thay bố cục cũ hai cốc nhỏ dồn mép trái, Khỉ lơ lửng bên phải, góc phải và phần dưới bỏ trống; S02-01-a mây trên, giọt mưa giữa, phân tử khí bay từ trái vào giọt, nhãn ''axit nhẹ'' bên phải; S04-01-a hơi nước bốc lên từ mặt biển (chân trời 45%) là điểm chính, Khỉ ngạc nhiên nhỏ góc phải dưới (28% bề ngang), chữ bên trái dưới; S04-03-b vòng tuần hoàn chiếm giữa, chữ ''hàng
    triệu năm'' trên, Khỉ ôm Trái Đất và cốc biển ở hai góc dưới; S05-01-a chuỗi Mưa → Sông → Bốc hơi xếp từ trên xuống, nhãn bên phải; S05-02-a logo trên, nút ĐĂNG KÝ và chuông, ''Cùng Khỉ nhé!'' dưới nút, Khỉ vui mừng dưới cùng. Không chữ, Khỉ hay nút nào nằm dưới vùng giao diện của Shorts/TikTok/Reels (DSN-A08 đo: đạt). Phần dưới 461 px để trống ở khung nền xanh là chủ ý (vùng chú thích, tên kênh của nền tảng). Sau khi vẽ cảnh dọc đã ghép lại cả 18 khung bằng cảnh thật: hạ hộp hạt muối S02-02-b/S02-03-a xuống y 44 % để hạt nằm đúng miệng vết nứt trên đỉnh đá (trước đó lơ lửng phía trên). Đo chữ trong trình duyệt (Tool 07) cho thấy chữ hai dòng cần thêm chỗ: tiêu đề ''Sông ngọt, biển mặn?'' nới hộp lên 14,5 % (y 61), ''hàng triệu năm'' 12,4 %, vòng tuần hoàn thu còn 68 % và dời xuống y 24,5 %; ghép lại hai khung: vẫn trong vùng an toàn, không chồng lên cốc hay Khỉ.'
DSN-C03:
  verdict: pass
  evidence: 'Hình khớp nghĩa và đúng lúc ở mọi khung. S04-04-a đã thêm e3 A-KHOANG-CHAT với enter slide_up at 0.7, khớp chữ "thả khoáng chất vào nước" (âm tiết 15–20 trên 20 ≈ 0.7). Mô tả A-DAY-BIEN đã bỏ phần khoáng chất để không vẽ trùng. Đã kiểm lại các khung khoa học: hơi nước không mang muối (S04-01-a), cốc biển dừng ở mức hiện nay (S04-03-b, đúng NOAA). Đã kiểm lại mốc chữ sau khi giọng nhanh hơn: các nhãn đưa lên sớm 0,06–0,08 (vd. "axit nhẹ" 0.56, "muối" 0.6) — vẫn ngay trước/đúng lúc từ khoá được nói, không đến sau lời. Kịch bản đã viết lại theo văn phong nghiêm túc (28/11) nhưng giữ nguyên ý từng đoạn, nên hình vẫn khớp: S01 "Muối trong biển từ đâu mà có?" khớp Khỉ thắc mắc giữa hai cốc; S02-01 "mưa hoà tan khí cacbonic nên hơi có tính axit" khớp phân tử khí bay vào giọt mưa và nhãn "axit nhẹ"; S03-01 "lượng muối rất nhỏ" khớp kính lúp chỉ 3 hạt muối; S04-01 "muối không bốc hơi theo, mà ở lại trong biển" khớp hàng muối ở lại dưới nước. Nhãn "axit nhẹ" (S02-01-a) lùi từ 0,56 về
    0,68: trước đó vào sớm 2,1 giây vì lời mới đẩy cụm "hơi có tính axit" xuống cuối đoạn; giờ ở khung 295, sớm 1,4 giây (đo theo timeline). Thử 0,78 và 0,70 thì DSN-A07 báo nhãn hiện chưa đủ 1,6 giây. Lời mới ngắn hơn ở vài đoạn nên DSN-A07 báo 3 nhãn hiện chưa đủ lâu; đã cho xuất hiện sớm hơn: "muối" từ 0,6 về 0,45, "nước ngọt mới" từ 0,28 về 0,2, "Muối dồn về biển" từ 0,1 về 0. Lần trước đã kiểm thêm cảnh mới: cửa sông S01-01-a cho thấy đúng sông đổ ra biển; A-NEN-MUA là trời mưa cho chặng mưa – đá; bản đồ S03-02-b có lớp A-SANG-BIEN khớp đúng vùng biển; bãi biển S04-01-a có muối nằm DƯỚI mặt nước (hộp y 62–72, biển 50–80%), không nằm trên cát.'
DSN-C04:
  verdict: pass
  evidence: '6 tiếng động, mỗi cái gắn với một hành động có nghĩa: pop ← dấu hỏi bật (S01-01-b); lách tách ← hạt bong khỏi đá (S02-02-b); róc rách ← muối trôi (S02-03); pop nhẹ ← mây hình thành (S04-01-a, rơi đúng chữ "thành mây", củng cố từ đó chứ không che, vì là tiếng nhẹ dưới giọng); whoosh ← mây trôi đi trong đoạn im lặng S04-02; click ← nút đăng ký. Dày nhất 1–2 cái mỗi 10 giây.'
DSN-C05:
  verdict: pass
  evidence: 'Theo brand.style kênh Khỉ Khám Phá:

    - 10 cảnh kind scene dùng màu tự nhiên trong scene_palette.

    - Icon, chữ, nút dùng bảng 6 màu kênh (xanh dương #0078E0, vàng #FFC907, trắng, nâu gỗ #5E270E, cam, xanh lá). Màu cũ #0B3D91, #FFD23F, #1B1B1F đã thay hết (DSN-A06 đạt).

    - Khung giải thích nền xanh đậm #0B3D91: chủ dự án chọn sau khi xem so sánh 3 phương án (nâu gỗ, #0B3D91, #0058A8) ngày 28/11/2026. Cảnh kết giữ nền xanh trời #0078E0 giống ảnh bìa.

    - text_plate xanh đậm, độ đậm 0,9, always: true. Lúc đầu đặt 0,85 thì DSN-A05 bắt lỗi: chữ vàng trên chỗ trắng nhất của cảnh chỉ đạt 4,38:1. Nâng lên 0,9 thì đạt 5,04:1.

    - 5 asset kind mascot lấy đúng biểu cảm trong brand.mascot.

    Phong cách Khỉ (vẽ chi tiết) khác cảnh phẳng, nhưng đây là chủ ý thương hiệu (chủ dự án chọn dùng PNG gốc). Khỉ luôn có viền trắng như sticker nên tách rõ khỏi cảnh, không lẫn.'
