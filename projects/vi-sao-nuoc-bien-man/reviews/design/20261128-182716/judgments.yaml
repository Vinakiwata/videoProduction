  evidence: 'Cùng đối tượng dùng cùng asset và cùng hộp qua khung nối: A-SONG ở S03-01-b và S03-02-a; A-DA + A-NEN-MUA ở S02-02-a/b, S02-03-a, S04-03-a; A-BIEN ở S04-01-a → S04-02-a (match_cut, cùng hộp); A-MAY, A-COC-BIEN lặp lại; Khỉ thắc mắc S01-01-b → S01-02-a và Khỉ ngạc nhiên S04-01-a → S04-02-a cùng hộp nên không nhảy chỗ. Hướng theo khung dọc: dòng chảy chính đi từ trên xuống — cửa sông S01-01-a sông từ núi phía trên đổ ra biển phía dưới, camera lia xuống (pan_down) theo dòng; suối S03-01-a chảy từ núi xuống nhập sông ở dưới; bản đồ S03-02-b sông đổ về biển ở 1/3 dưới; giọt mưa luôn rơi từ mây xuống; chuỗi tóm tắt S05-01-a xếp từ trên xuống với mũi tên chỉ xuống. Chuyển động ngang chỉ còn ở chi tiết nhỏ có lý do: phân tử khí bay phải vào giọt, muối trôi phải rời khỏi đá (S02-03), mây trôi trái về đất liền (S04-02/S04-03-a). Bố cục trời trên, đất/biển dưới nhất quán ở mọi cảnh.'
