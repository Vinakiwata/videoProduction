  verdict: pass
  evidence: 'Cùng đối tượng dùng cùng asset: A-SONG ở S03-01-b và S03-02-a; A-DA + A-NEN-MUA ở S02-02-a/b, S02-03-a, S04-03-a; A-BIEN ở S04-01-a và S04-02-a (cùng hộp, nối match_cut); A-MAY và A-COC-BIEN lặp lại. Hướng: cửa sông S01-01-a sông chảy trái → phải ra biển; S02-03 muối trôi phải; suối S03-01-a nhập sông chảy sang phải; ở A-SONG sông chảy từ núi ra phía trước (trung tính, không ngược hướng); S04-02 mây trôi trái về đất liền, rồi S04-03-a mây vào từ phải đổ mưa lên đá. Bố cục trời trên, đất/biển dưới giữ nhất quán ở mọi cảnh. Khỉ giữ liên tục qua các khung match cut: A-KHI-THAC-MAC ở S01-01-b → S01-02-a và A-KHI-NGAC-NHIEN ở S04-01-a → S04-02-a, cùng hộp nên không nhảy chỗ. Mỗi lần xuất hiện dùng biểu cảm đúng ý câu: thắc mắc khi hỏi, ngạc nhiên khi lộ đáp án, ôm Trái Đất khi nói quy mô hàng triệu năm, vui mừng khi mời đăng ký.'
