ATC-C01:
  verdict: pass
  evidence: Animatic dựng lại bằng giọng thật Xuân Vĩnh nâng +2,5 nửa cung, khoảng 52 giây. Đoạn dài nhất S02-01 (5,9 giây), ngắn nhất S05-02 (4,0 giây). Ba khoảng nghỉ S01-02, S02-03, S04-02 vẫn giữ. Không khoảng nào > 4 giây không đổi hình, không dồn hai ý mới liền nhau. Giọng chậm hơn bản ước tính cũ (4,15 so với 4,43 âm tiết/giây), nên nhịp thoáng hơn, hợp lối nói chuyện dí dỏm.
ATC-C02:
  verdict: pass
  evidence: 'Che phụ đề vẫn theo được mạch. Lần này đối chiếu với 18 khung ghép bằng hình SVG thật: cửa sông → hai cốc + ''Sông ngọt → Biển mặn?'' → trời mưa, giọt ''axit nhẹ'' → tảng đá thật, hạt bong ra ở vết nứt ''muối'' → sườn núi, suối nhập sông → kính lúp trên lòng sông ''rất ít muối'' → mưa xuống thung lũng sông ''nước ngọt mới'' → bản đồ, biển sáng lên ''Muối dồn về biển'' → bãi biển: mặt trời, hơi nước bốc từ mặt biển, muối ở dưới nước ''Nước bay đi, muối ở lại'' → vòng tuần hoàn ''hàng triệu năm'' → đáy biển núi lửa ''Nguồn thêm'' → Mưa → Sông → Bốc hơi → nút đăng ký. Cảnh thật giúp nhận ra sông, biển, đá ngay mà không cần chữ. Khỉ làm mạch rõ hơn khi tắt tiếng: thắc mắc ở câu hỏi mở đầu, ngạc nhiên lúc lộ đáp án, ôm Trái Đất ở ''hàng triệu năm'', vui mừng ở lời mời đăng ký.'
ATC-C03:
  verdict: pass
  reviewer: Vinakiwata (chủ dự án, nghe)
  evidence: 'Đọc lời mới mà không nhìn hình vẫn theo được mạch nhân quả: câu hỏi "Muối ở đâu ra vậy ta?" → "thủ phạm đầu tiên là nước mưa… hơi chua" → "gặm… hoà tan khoáng chất… có muối" → "rủ nhau về suối, về sông… xíu xiu" → "sông vẫn ngọt, biển gom muối" → "muối không biết bay, ở lại" → "hàng triệu năm" → "thêm nguồn đáy biển" → tóm tắt. Các câu nhân hoá không gây hiểu sai, vì ngay sau đó đều có ý khoa học rõ: "hơi chua", "hoà tan khoáng chất", "ở lại dưới biển".'
ATC-C04:
  verdict: pass
  evidence: 00:00 cảnh cửa sông hiện ra cùng câu móc "Ê bạn ơi, sông đổ ra biển toàn nước ngọt. Vậy mà biển lại mặn chát!"; khoảng 1,8 giây chuyển xuyên sang hai cốc với Khỉ thắc mắc; câu hỏi "Muối ở đâu ra vậy ta?" kết thúc ở khoảng 5 giây. Thay đổi thị giác mạnh và câu móc đều nằm trong 5 giây đầu.
ATC-C05:
  verdict: pass
  evidence: Ba thay đổi lớn (cảnh chân thật; kênh Khỉ Khám Phá có linh vật; giọng Xuân Vĩnh + lời dí dỏm) đều đã chốt và chủ dự án đã duyệt. Cấu trúc nhân quả và hình giữ nguyên. Việc còn lại chỉ là thay thời lượng ước tính bằng giọng thật, không phải thay đổi lớn.
ATC-C06:
  verdict: pass
  evidence: 'Nguồn thời lượng: giọng nháp thật (VieNeu v3 Turbo Xuân Vĩnh, Mac, theo câu, chọn lượt tốt hơn trong 2 lượt, nâng +2,5 nửa cung, đo cao độ trung vị 123 Hz), đã chép sang 03_animatic/scratch_voice. Không còn dựa vào ước tính. Tốc độ kênh đã hiệu chỉnh 4,15 âm tiết/giây.'
