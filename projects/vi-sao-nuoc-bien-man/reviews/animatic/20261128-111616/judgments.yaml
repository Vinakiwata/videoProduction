  evidence: 'Đã dựng lại animatic bằng giọng thật (voice to-animatic → animatic build), dài 47,9 giây, timing.yaml không đổi so với lần duyệt trước vì lời và giọng giữ nguyên; chỉ nội dung hình đổi (cảnh chân thật). Xem khung 00:02 (S01-01-b) và 00:30 (S04-02-a): phần tử vào đúng mốc. Không khoảng nào > 4 giây không đổi hình; dài nhất S04-04-a ≈ 3,3 giây, có camera và núi lửa nhấp nháy.'
ATC-C02:
  verdict: pass
  evidence: 'Che phụ đề vẫn theo được mạch. Lần này đối chiếu với 18 khung ghép bằng hình SVG thật: cửa sông → hai cốc + ''Sông ngọt → Biển mặn?'' → trời mưa, giọt ''axit nhẹ'' → tảng đá thật, hạt bong ra ở vết nứt ''muối'' → sườn núi, suối nhập sông → kính lúp trên lòng sông ''rất ít muối'' → mưa xuống thung lũng sông ''nước ngọt mới'' → bản đồ, biển sáng lên ''Muối dồn về biển'' → bãi biển: mặt trời, hơi nước bốc từ mặt biển, muối ở dưới nước ''Nước bay đi, muối ở lại'' → vòng tuần hoàn ''hàng triệu năm'' → đáy biển núi lửa ''Nguồn thêm'' → Mưa → Sông → Bốc hơi → nút đăng ký. Cảnh thật giúp nhận ra sông, biển, đá ngay mà không cần chữ.'
