ATC-C01:
  verdict: pass
  evidence: Animatic dựng tạm theo thời lượng ước tính của lời văn nghiêm túc (52,9 giây, 4,15 âm tiết/giây đã hiệu chỉnh), trong lúc chờ dựng giọng thật. Ba khoảng nghỉ vẫn giữ. Không khoảng nào > 4 giây không đổi hình, không dồn hai ý mới liền nhau.
ATC-C02:
  verdict: pass
  evidence: 'Che phụ đề vẫn theo được mạch. Lần này đối chiếu với 18 khung ghép bằng hình SVG thật: cửa sông → hai cốc + ''Sông ngọt → Biển mặn?'' → trời mưa, giọt ''axit nhẹ'' → tảng đá thật, hạt bong ra ở vết nứt ''muối'' → sườn núi, suối nhập sông → kính lúp trên lòng sông ''rất ít muối'' → mưa xuống thung lũng sông ''nước ngọt mới'' → bản đồ, biển sáng lên ''Muối dồn về biển'' → bãi biển: mặt trời, hơi nước bốc từ mặt biển, muối ở dưới nước ''Nước bay đi, muối ở lại'' → vòng tuần hoàn ''hàng triệu năm'' → đáy biển núi lửa ''Nguồn thêm'' → Mưa → Sông → Bốc hơi → nút đăng ký. Cảnh thật giúp nhận ra sông, biển, đá ngay mà không cần chữ. Khỉ làm mạch rõ hơn khi tắt tiếng: thắc mắc ở câu hỏi mở đầu, ngạc nhiên lúc lộ đáp án, ôm Trái Đất ở ''hàng triệu năm'', vui mừng ở lời mời đăng ký.'
ATC-C03:
  verdict: pass
  reviewer: Vinakiwata (chủ dự án, nghe)
  evidence: 'Đọc lời văn nghiêm túc mà không nhìn hình vẫn theo được mạch nhân quả, không có câu nào gây hiểu sai: câu hỏi → nước mưa hơi có tính axit → bào mòn, hoà tan khoáng chất có muối → sông mang lượng muối rất nhỏ → sông vẫn ngọt, biển nhận muối → muối không bốc hơi theo → tích tụ qua hàng triệu năm → nguồn bổ sung dưới đáy biển → tóm tắt.'
ATC-C04:
  verdict: pass
  evidence: 00:00 cảnh cửa sông hiện ra cùng câu móc "Sông đổ ra biển toàn là nước ngọt. Vậy mà nước biển lại mặn."; khoảng 1,8 giây chuyển xuyên sang hai cốc với Khỉ thắc mắc; câu hỏi "Muối trong biển từ đâu mà có?" kết thúc ở khoảng 5,1 giây. Thay đổi thị giác mạnh và câu móc đều trong 5 giây đầu.
ATC-C05:
  verdict: pass
  evidence: Các thay đổi lớn (cảnh chân thật; kênh Khỉ Khám Phá; giọng Xuân Vĩnh; văn phong nghiêm túc) đều đã chốt và chủ dự án đã duyệt. Việc còn lại chỉ là thay ước tính bằng giọng thật.
ATC-C06:
  verdict: pass
  evidence: 'Nguồn thời lượng: ước tính (4,15 âm tiết/giây, đã hiệu chỉnh từ giọng Xuân Vĩnh thật hôm nay, nên sai số nhỏ). Giọng thật (45 lượt) đã có, sẽ dựng ngay sau cổng này, rồi chạy voice to-animatic, dựng lại animatic và duyệt lại.'
