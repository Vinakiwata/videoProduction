ATC-C01:
  verdict: pass
  evidence: 'Trích 49 khung (1/giây), đối chiếu timing.yaml (48,7 giây, ước tính theo tốc độ đã hiệu chỉnh 4,43 âm tiết/giây). Không có khoảng > 4 giây không đổi hình. Khoảng dài nhất là S04-04-a, từ 00:35,6 (chữ "Nguồn thêm") tới 00:39,0 (khoáng chất bay lên), ≈ 3,4 giây, có camera zoom_in và núi lửa nhấp nháy. Không có cụm dồn dập: S05-01 hiện 3 biểu tượng cách nhau khoảng 1,2–1,6 giây.'
ATC-C02:
  verdict: pass
  evidence: 'Che dải phụ đề vẫn đọc được mạch: sông ra biển → 2 cốc + "Sông ngọt → Biển mặn?" → giọt mưa "axit nhẹ" → đá, hạt bong ra "muối" → suối thành sông, kính lúp "rất ít muối" → mưa xuống sông "nước ngọt mới" → bản đồ "Muối dồn về biển" → mặt trời, hơi nước "Nước bay đi, muối ở lại" → vòng tuần hoàn "hàng triệu năm" → đáy biển "Nguồn thêm" → Mưa → Sông → Bốc hơi → nút đăng ký "Mỗi tuần một hiện tượng". Đây là wireframe; hình thật ở Tool 06 phải giữ đúng chuỗi và nhãn này.'
ATC-C03:
  verdict: na
  evidence: 'Bản animatic này dựng bằng thời lượng ước tính (manifest.voice_source = estimate). Giọng theo câu mới vừa tạo và chưa được nghe duyệt. Mục này sẽ kiểm ở lần dựng lại animatic có giọng, khi chủ dự án nghe theo phiếu nghe.'
ATC-C04:
