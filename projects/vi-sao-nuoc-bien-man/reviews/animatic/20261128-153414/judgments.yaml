ATC-C02:
  verdict: pass
  evidence: 'Che phụ đề vẫn theo được mạch. Lần này đối chiếu với 18 khung ghép bằng hình SVG thật: cửa sông → hai cốc + ''Sông ngọt → Biển mặn?'' → trời mưa, giọt ''axit nhẹ'' → tảng đá thật, hạt bong ra ở vết nứt ''muối'' → sườn núi, suối nhập sông → kính lúp trên lòng sông ''rất ít muối'' → mưa xuống thung lũng sông ''nước ngọt mới'' → bản đồ, biển sáng lên ''Muối dồn về biển'' → bãi biển: mặt trời, hơi nước bốc từ mặt biển, muối ở dưới nước ''Nước bay đi, muối ở lại'' → vòng tuần hoàn ''hàng triệu năm'' → đáy biển núi lửa ''Nguồn thêm'' → Mưa → Sông → Bốc hơi → nút đăng ký. Cảnh thật giúp nhận ra sông, biển, đá ngay mà không cần chữ. Khỉ làm mạch rõ hơn khi tắt tiếng: thắc mắc ở câu hỏi mở đầu, ngạc nhiên lúc lộ đáp án, ôm Trái Đất ở ''hàng triệu năm'', vui mừng ở lời mời đăng ký.'
