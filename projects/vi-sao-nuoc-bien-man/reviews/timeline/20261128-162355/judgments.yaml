  evidence: 'Timeline khoá theo giọng thật lời văn nghiêm túc: 1602 khung = 53,4 giây, 18 khung hình, 83 cue, 6 SFX. Đã đối chiếu 12 mốc với vị trí từ khoá trong lời (ước theo tỉ lệ âm tiết trong đoạn):

