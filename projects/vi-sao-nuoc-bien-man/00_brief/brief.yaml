title: Vì sao nước biển lại mặn?
goal: Sau khoảng 50 giây, người xem giải thích lại được vì sao biển mặn còn sông thì không (mưa hoà tan khoáng chất trong đá, sông mang muối ra biển, nước bốc hơi còn muối ở lại) và muốn xem tiếp kênh
audience: Học sinh trung học và người lớn tò mò, xem trên điện thoại và máy tính
channel: youtube
format:
  width: 1920
  height: 1080
  fps: 30
target_duration_s: 50
tone: Thân thiện, tò mò, rõ ràng; xưng "mình" – gọi "bạn"
cta: Đăng ký kênh để mỗi tuần cùng Khỉ khám phá thêm một hiện tượng khoa học
brand:
  colors:
  - '#0078E0'
  - '#FFC907'
  - '#FFFFFF'
  - '#5E270E'
  - '#FD8305'
  - '#669F2D'
  fonts:
  - Be Vietnam Pro
  voice: 'VieNeu-TTS v3 Turbo: Hải Đăng'
  style: Minh hoạ phẳng (flat), nét tròn, bóng đổ nhẹ. Cảnh minh hoạ vẽ như phong cảnh thật bằng màu tự nhiên trong scene_colors; icon, chữ, nút dùng bảng màu Khỉ Khám Phá (xanh dương, vàng, trắng, nâu gỗ, cam, xanh lá). Mọi chữ đặt trên tấm nền nâu gỗ như bảng tên trong logo. Linh vật Khỉ (PNG gốc của bộ nhận diện) phản ứng 2–3 lần ở điểm nhấn và có mặt ở cảnh kết
