total_s: 65.9
segments:
- id: S01-01
  kind: voice
  start_s: 0.0
  dur_s: 5.7
  source: estimate
  text: Sông đổ ra biển là nước ngọt. Vậy mà nước biển lại mặn chát. Muối từ đâu ra?
- id: S01-02
  kind: silent
  start_s: 5.7
  dur_s: 1.0
  source: silent
  text: null
- id: S02-01
  kind: voice
  start_s: 6.7
  dur_s: 5.0
  source: estimate
  text: Khi rơi qua bầu trời, nước mưa hoà tan khí cacbonic và trở nên hơi chua.
- id: S02-02
  kind: voice
  start_s: 11.7
  dur_s: 7.2
  source: estimate
  text: Nước mưa chua nhẹ ấy chảy trên đá, bào mòn và hoà tan những hạt khoáng chất li ti, trong đó có muối.
- id: S02-03
  kind: silent
  start_s: 18.9
  dur_s: 1.0
  source: silent
  text: null
- id: S03-01
  kind: voice
  start_s: 19.9
  dur_s: 6.3
  source: estimate
  text: Nước mưa gom về suối, về sông, mang theo lượng muối rất nhỏ, nhỏ đến mức ta không nếm ra.
- id: S03-02
  kind: voice
  start_s: 26.2
  dur_s: 7.2
  source: estimate
  text: Sông luôn được mưa bổ sung nước ngọt mới, nên vẫn ngọt. Còn biển thì nhận muối từ tất cả các dòng sông.
- id: S04-01
  kind: voice
  start_s: 33.4
  dur_s: 6.0
  source: estimate
  text: Dưới nắng, nước biển bốc hơi bay lên thành mây. Nhưng muối thì không bay theo, nó ở lại.
- id: S04-02
  kind: silent
  start_s: 39.4
  dur_s: 1.0
  source: silent
  text: null
- id: S04-03
  kind: voice
  start_s: 40.4
  dur_s: 7.5
  source: estimate
  text: Mây lại mưa xuống đất, vòng lặp ấy kéo dài hàng triệu năm, muối trong biển tích dần đến độ mặn như hôm nay.
- id: S04-04
  kind: voice
  start_s: 47.9
  dur_s: 6.3
  source: estimate
  text: Thêm một nguồn nữa, núi lửa và các khe nứt nóng dưới đáy biển cũng thả khoáng chất vào nước.
- id: S05-01
  kind: voice
  start_s: 54.2
  dur_s: 6.3
  source: estimate
  text: Tóm lại, mưa hoà tan muối từ đá, sông chở muối ra biển, nước bốc hơi còn muối ở lại.
- id: S05-02
  kind: voice
  start_s: 60.5
  dur_s: 5.4
  source: estimate
  text: Đăng ký kênh để mỗi tuần cùng mình khám phá thêm một hiện tượng khoa học nhé!
