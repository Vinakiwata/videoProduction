segments:
- id: S01-01
  kind: voice
  text: Sông đổ ra biển toàn là nước ngọt. Vậy mà nước biển lại mặn. Muối trong biển từ đâu mà có?
  start_frame: 0
  speech_end_frame: 145
  end_frame: 145
  breath_s: 0.0
- id: S01-02
  kind: silent
  text: null
  start_frame: 145
  speech_end_frame: 175
  end_frame: 175
  breath_s: 0.0
- id: S02-01
  kind: voice
  text: Câu trả lời bắt đầu từ nước mưa. Khi rơi qua bầu trời, mưa hoà tan khí cacbonic nên hơi có tính axit.
  start_frame: 175
  speech_end_frame: 352
  end_frame: 370
  breath_s: 0.6
- id: S02-02
  kind: voice
  text: Nước mưa ấy chảy trên đá, bào mòn dần và hoà tan các khoáng chất li ti, trong đó có muối.
  start_frame: 370
  speech_end_frame: 498
  end_frame: 498
  breath_s: 0.0
- id: S02-03
  kind: silent
  text: null
  start_frame: 498
  speech_end_frame: 528
  end_frame: 528
  breath_s: 0.0
- id: S03-01
  kind: voice
  text: Nước mưa chảy về suối, về sông, mang theo một lượng muối rất nhỏ, nhỏ đến mức ta không nếm ra.
  start_frame: 528
  speech_end_frame: 676
  end_frame: 694
  breath_s: 0.6
- id: S03-02
  kind: voice
  text: Sông luôn được mưa bổ sung nước ngọt mới, nên vẫn ngọt. Còn biển nhận muối từ tất cả các dòng sông.
  start_frame: 694
  speech_end_frame: 836
  end_frame: 863
  breath_s: 0.9
- id: S04-01
  kind: voice
  text: Dưới nắng, nước biển bốc hơi thành mây. Nhưng muối không bốc hơi theo, mà ở lại trong biển.
  start_frame: 863
  speech_end_frame: 999
  end_frame: 999
  breath_s: 0.0
- id: S04-02
  kind: silent
  text: null
  start_frame: 999
  speech_end_frame: 1029
  end_frame: 1029
  breath_s: 0.0
- id: S04-03
  kind: voice
  text: Mây lại đổ mưa, vòng tuần hoàn ấy lặp lại suốt hàng triệu năm, khiến muối trong biển tích tụ dần.
  start_frame: 1029
  speech_end_frame: 1177
  end_frame: 1195
  breath_s: 0.6
- id: S04-04
  kind: voice
  text: Ngoài ra, núi lửa và các khe nứt nóng dưới đáy biển cũng bổ sung thêm khoáng chất vào nước.
  start_frame: 1195
  speech_end_frame: 1320
  end_frame: 1347
  breath_s: 0.9
- id: S05-01
  kind: voice
  text: Tóm lại, mưa hoà tan muối từ đá, sông đưa muối ra biển, nước bốc hơi còn muối ở lại.
  start_frame: 1347
  speech_end_frame: 1481
  end_frame: 1499
  breath_s: 0.6
- id: S05-02
  kind: voice
  text: Đăng ký kênh để mỗi tuần cùng Khỉ khám phá thêm một hiện tượng khoa học nhé!
  start_frame: 1499
  speech_end_frame: 1602
  end_frame: 1602
  breath_s: 0.0
