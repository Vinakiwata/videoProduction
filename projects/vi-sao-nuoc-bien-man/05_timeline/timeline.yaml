segments:
- id: S01-01
  kind: voice
  text: Sông đổ ra biển là nước ngọt. Vậy mà nước biển lại mặn chát. Muối từ đâu ra?
  start_frame: 0
  speech_end_frame: 140
  end_frame: 140
  breath_s: 0.0
- id: S01-02
  kind: silent
  text: null
  start_frame: 140
  speech_end_frame: 170
  end_frame: 170
  breath_s: 0.0
- id: S02-01
  kind: voice
  text: Khi rơi qua bầu trời, nước mưa hoà tan khí cacbonic và trở nên hơi chua.
  start_frame: 170
  speech_end_frame: 287
  end_frame: 305
  breath_s: 0.6
- id: S02-02
  kind: voice
  text: Nước mưa chua nhẹ ấy chảy trên đá, bào mòn và hoà tan những hạt khoáng chất li ti, trong đó có muối.
  start_frame: 305
  speech_end_frame: 453
  end_frame: 453
  breath_s: 0.0
- id: S02-03
  kind: silent
  text: null
  start_frame: 453
  speech_end_frame: 483
  end_frame: 483
  breath_s: 0.0
- id: S03-01
  kind: voice
  text: Nước mưa gom về suối, về sông, mang theo lượng muối rất nhỏ, nhỏ đến mức ta không nếm ra.
  start_frame: 483
  speech_end_frame: 626
  end_frame: 644
  breath_s: 0.6
- id: S03-02
  kind: voice
  text: Sông luôn được mưa bổ sung nước ngọt mới, nên vẫn ngọt. Còn biển thì nhận muối từ tất cả các dòng sông.
  start_frame: 644
  speech_end_frame: 796
  end_frame: 823
  breath_s: 0.9
- id: S04-01
  kind: voice
  text: Dưới nắng, nước biển bốc hơi bay lên thành mây. Nhưng muối thì không bay theo, nó ở lại.
  start_frame: 823
  speech_end_frame: 962
  end_frame: 962
  breath_s: 0.0
- id: S04-02
  kind: silent
  text: null
  start_frame: 962
  speech_end_frame: 992
  end_frame: 992
  breath_s: 0.0
- id: S04-03
  kind: voice
  text: Mây lại mưa xuống đất, vòng lặp ấy kéo dài hàng triệu năm, muối trong biển tích dần đến độ mặn như hôm nay.
  start_frame: 992
  speech_end_frame: 1142
  end_frame: 1160
  breath_s: 0.6
- id: S04-04
  kind: voice
  text: Thêm một nguồn nữa, núi lửa và các khe nứt nóng dưới đáy biển cũng thả khoáng chất vào nước.
  start_frame: 1160
  speech_end_frame: 1286
  end_frame: 1313
  breath_s: 0.9
- id: S05-01
  kind: voice
  text: Tóm lại, mưa hoà tan muối từ đá, sông chở muối ra biển, nước bốc hơi còn muối ở lại.
  start_frame: 1313
  speech_end_frame: 1449
  end_frame: 1467
  breath_s: 0.6
- id: S05-02
  kind: voice
  text: Đăng ký kênh để mỗi tuần cùng mình khám phá thêm một hiện tượng khoa học nhé!
  start_frame: 1467
  speech_end_frame: 1563
  end_frame: 1563
  breath_s: 0.0
