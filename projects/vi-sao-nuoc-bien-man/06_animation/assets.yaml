motion_defaults:
  note: Áp dụng khi storyboard không ghi ease. Tool 07 bắt buộc dùng; không có chuyển động tuyến tính trừ typewriter (bản chất là gõ từng ký tự).
  enter:
    fade: ease_out
    draw: ease_in_out
    pop: back_out
    drop: ease_in
    scale_in: ease_out
    slide: ease_out
    typewriter: steps
  exit:
    fade: ease_in
    scale_out: back_in
    slide: ease_in
  loop:
    bob: sine_in_out
    wiggle: sine_in_out
    pulse: sine_in_out
    shimmer: sine_in_out
    flow: linear_seamless
    rotate: linear_seamless
  drop_squash: 'Giọt mưa chạm đích: squash 0,85/1,15 trong 4 khung rồi hồi về (follow-through).'
