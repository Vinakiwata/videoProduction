      - {id: e2, text: 'Nguồn thêm: đáy biển', style: label, font_px: 64, color: '#FFC907', box: {x: 6, y: 12, w: 78, h: 6.5}, enter: {anim: fade, at: 0.1, dur_s: 0.3}}
    notes: Miệng núi lửa và khe nứt phát sáng nhịp chậm; chấm khoáng chất (e3) bay lên đúng lúc nói "thả khoáng chất vào nước".
