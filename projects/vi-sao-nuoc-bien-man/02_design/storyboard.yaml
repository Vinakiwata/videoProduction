      - {id: e6, text: 'Nước bay đi, muối ở lại', style: label, font_px: 64, color: '#FFC907', box: {x: 6, y: 60, w: 46, h: 12}, enter: {anim: fade, at: 0.5, dur_s: 0.3}}
    sfx:
      - {name: pop nhẹ, target: e4, event: enter}
    notes: Hơi nước bốc lên từ mặt biển (đường chân trời ở 45% chiều cao) chỉ mang chấm trắng (nước); hàng muối nằm dưới mặt nước sáng lên đúng lúc nói "muối thì không bay theo".
