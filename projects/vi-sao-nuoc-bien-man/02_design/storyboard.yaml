    background: '#0B3D91'
    focal: e3
    camera: {move: static}
    transition_in: crossfade
    elements:
      - {id: e2, asset: A-BIEN, box: {x: 0, y: 0, w: 100, h: 100}, loop: {anim: bob, period_s: 2.5}}
      - {id: e1, asset: A-MAT-TROI, box: {x: 8, y: 13, w: 22, h: 12.4}, enter: {anim: scale_in, at: 0, dur_s: 0.5, ease: back_out}, loop: {anim: rotate, period_s: 8}}
