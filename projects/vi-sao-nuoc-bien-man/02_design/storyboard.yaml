    sfx:
      - {name: whoosh nhẹ, target: e4, event: exit}
    notes: Mây trôi sang trái (về phía đất liền) để mở vòng tuần hoàn.
  - id: S04-03-a
    segment: S04-03
    span: [0, 0.22]
    purpose: Mây mưa xuống đất liền — vòng lặp bắt đầu lại
