    segment: S04-02
    span: [0, 1]
    purpose: Nhịp nghỉ — muối lấp lánh ở lại, mây trôi về đất liền
    background: '#0B3D91'
    focal: e5
    camera: {move: static}
    transition_in: match_cut
    elements:
      - {id: e2, asset: A-BIEN, box: {x: 0, y: 0, w: 100, h: 100}, loop: {anim: bob, period_s: 2.5}}
      - {id: e1, asset: A-MAT-TROI, box: {x: 8, y: 13, w: 22, h: 12.4}, loop: {anim: rotate, period_s: 8}}
      - {id: e4, asset: A-MAY, box: {x: 34, y: 13, w: 36, h: 8}, exit: {anim: slide_left, at: 0.2, dur_s: 0.8, ease: ease_in}}
      - {id: e5, asset: A-MUOI-O-LAI, box: {x: 6, y: 50, w: 70, h: 6.7}, loop: {anim: shimmer}}
      - {id: e7, asset: A-KHI-NGAC-NHIEN, box: {x: 55, y: 58, w: 28, h: 15.7}}
