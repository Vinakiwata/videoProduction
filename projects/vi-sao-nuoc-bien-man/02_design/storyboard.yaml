    notes: Mắt kính đặt đúng trên lòng sông đoạn giữa (tâm ≈ 45%, 45% khung dọc; cán kính chĩa xuống); trong mắt kính chỉ có đúng 3 hạt muối thưa thớt, phần còn lại là nước trong.
