    background: '#0B3D91'
    focal: e1
    camera: {move: zoom_out, amount: 0.15}
    transition_in: crossfade
    elements:
      - {id: e1, asset: A-VONG-TUAN-HOAN, box: {x: 7, y: 23.5, w: 70, h: 39.4}, enter: {anim: draw, at: 0, dur_s: 1.0, ease: ease_out}, loop: {anim: rotate, period_s: 3}}
