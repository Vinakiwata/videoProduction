meta:
  title: Vì sao nước biển lại mặn?
  canvas: {width: 1080, height: 1920, fps: 30}
palette: ['#0078E0', '#FFC907', '#FFFFFF', '#5E270E', '#FD8305', '#669F2D', '#0B3D91']
fonts: {title: Be Vietnam Pro, body: Be Vietnam Pro}
scene_palette: ['#4A98D6', '#6F879E', '#8AA6CF', '#5B7DB1', '#7CC36A', '#5AA84C', '#3E9B4F', '#2F7A3A', '#8A5A2B', '#6B4A2E', '#3FA7E0', '#1F7FC4', '#145A9E', '#0A2A66', '#F2D49B', '#E3BC78', '#B4B4BC', '#8C8C94', '#5E5E66', '#FF7A2F']
text_plate: {color: '#0B3D91', opacity: 0.9, always: true}
style: Minh hoạ phẳng (flat), nét tròn, bóng đổ nhẹ. Cảnh minh hoạ (kind scene) vẽ như phong cảnh thật bằng màu tự nhiên; icon, chữ, nút dùng bảng màu Khỉ Khám Phá; khung giải thích nền xanh đậm #0B3D91; mọi chữ trên tấm nền xanh đậm; linh vật Khỉ (PNG gốc) phản ứng ở điểm nhấn và ở cảnh kết
# Kênh Khỉ Khám Phá (28/11/2026): khung giải thích nền xanh đậm, chữ luôn trên tấm nền xanh đậm; Khỉ phản ứng 3 lần + cảnh kết.
# Quy ước (28/11/2026): cảnh = phong cảnh thật màu tự nhiên (trời xanh, núi, cây xanh lá, sông xanh nhạt, biển xanh, cát vàng);
# chữ trên cảnh luôn có tấm nền text_plate. Icon/khung giải thích: biển/trời #0B3D91, nền tối #1B1B1F,
# nước ngọt, mưa, muối = trắng; năng lượng/nhấn mạnh (mặt trời, axit, chữ chính) = vàng #FFD23F.
# Khung dọc 9:16 (28/11/2026): dòng chảy chính trên -> dưới (núi ở trên, biển ở dưới); chuỗi ý xếp từ trên xuống.
# Vùng an toàn (lề chặt nhất Shorts/TikTok/Reels): x 6,1–83,9 %, y 11,5–75,9 % — chữ, Khỉ, nút luôn nằm trong; cảnh phủ kín khung.
assets:
  - {id: A-SONG, kind: scene, description: 'Phong cảnh sông khung dọc: trời xanh phía trên, dãy núi xa có đỉnh tuyết, đồi xanh có rặng cây thông hai bên, dòng sông xanh nhạt uốn lượn từ chân núi xuống phía dưới rồi rộng dần về phía người xem, gợn sóng trắng; không có mặt trời', colors: ['#4A98D6', '#8AA6CF', '#5B7DB1', '#FFFFFF', '#7CC36A', '#5AA84C', '#3E9B4F', '#2F7A3A', '#8A5A2B', '#3FA7E0', '#5E270E']}
  - {id: A-CUA-SONG, kind: scene, description: 'Phong cảnh cửa sông khung dọc: núi và đồi cây ở nửa trên, dòng sông uốn lượn chảy từ trên xuống rồi đổ ra biển xanh chiếm 1/3 dưới, bãi cát và bọt sóng trắng ở chỗ sông gặp biển', colors: ['#4A98D6', '#8AA6CF', '#5B7DB1', '#FFFFFF', '#7CC36A', '#5AA84C', '#3E9B4F', '#2F7A3A', '#8A5A2B', '#3FA7E0', '#5E270E', '#1F7FC4', '#145A9E', '#F2D49B', '#E3BC78']}
  - {id: A-SONG-ICON, kind: icon, description: 'Biểu tượng sông phẳng: dải trắng uốn lượn có vạch sóng xanh đậm, dùng trong chuỗi tóm tắt', colors: ['#FFFFFF', '#0078E0']}
  - {id: A-BIEN, kind: scene, description: 'Phong cảnh bãi biển khung dọc: trời xanh phía trên (chừa chỗ cho mặt trời góc trái trên), đường chân trời ở 45% chiều cao, biển xanh nhiều sắc độ từ 45% xuống 72%, sóng trắng, bãi cát vàng ở dưới có viền cát ướt và bọt sóng, cây dừa nghiêng ở mép trái, vài hòn đá nhỏ', colors: ['#4A98D6', '#0A2A66', '#145A9E', '#1F7FC4', '#FFFFFF', '#F2D49B', '#E3BC78', '#8A5A2B', '#3E9B4F', '#2F7A3A', '#8C8C94', '#5E5E66', '#5E270E']}
  - {id: A-COC-SONG, kind: icon, description: 'Cốc thuỷ tinh viền trắng, nước trong, giữa có biểu tượng giọt nước trắng; nhãn nhỏ "sông" dưới đáy cốc', colors: ['#FFFFFF']}
  - {id: A-COC-BIEN, kind: icon, description: 'Cốc thuỷ tinh viền trắng, nước xanh đậm, giữa có 3 hạt muối hình lập phương trắng; nhãn nhỏ "biển" dưới đáy cốc', colors: ['#FFFFFF', '#0078E0']}
  - {id: A-MAY, kind: illustration, description: 'Đám mây phẳng 3 khối tròn chồng nhau, màu trắng, đáy phẳng', colors: ['#FFFFFF']}
  - {id: A-GIOT-MUA, kind: icon, description: 'Giọt mưa hình giọt nước trắng, có điểm sáng nhỏ; nhiều giọt dùng chung asset này', colors: ['#FFFFFF']}
  - {id: A-GIOT-MUA-CHUA, kind: icon, description: 'Giọt mưa trắng có viền vàng dày và 2 bọt nhỏ vàng bên trong — biểu thị nước mưa hơi chua (axit nhẹ)', colors: ['#FFFFFF', '#FFC907']}
  - {id: A-PHANTU-KHI, kind: diagram, description: 'Cụm 5-6 phân tử khí: mỗi phân tử là 1 chấm tròn giữa nối 2 chấm nhỏ hai bên (kiểu CO2), màu trắng, bay lơ lửng', colors: ['#FFFFFF']}
  - {id: A-DA, kind: scene, description: 'Tảng đá granit thật nằm trên bãi cỏ: khối xám nhiều mặt sáng tối, mảng rêu xanh, vài vết nứt tối, khóm cỏ dưới chân, bóng đổ', colors: ['#B4B4BC', '#8C8C94', '#5E5E66', '#7CC36A', '#5AA84C', '#3E9B4F', '#5E270E', '#FFFFFF']}
  - {id: A-NEN-MUA, kind: scene, description: 'Phong cảnh đồi dưới trời mưa khung dọc: trời xám xanh âm u chiếm 3/4 trên (để trống cho mây, giọt mưa và tảng đá), đồi xa mờ, đồi gần xanh có vài cây ở dưới, vệt mưa trắng mảnh', colors: ['#6F879E', '#8AA6CF', '#5B7DB1', '#5AA84C', '#3E9B4F', '#2F7A3A', '#6B4A2E', '#FFFFFF']}
  - {id: A-HAT-MUOI, kind: icon, description: 'Cụm hạt muối li ti hình lập phương trắng, vài hạt to hơn có điểm sáng, dùng để bong khỏi đá và trôi theo nước', colors: ['#FFFFFF']}
  - {id: A-SUOI, kind: scene, description: 'Phong cảnh sườn núi khung dọc: núi xám xanh có tuyết ở trên, ba dòng suối xanh nhạt chảy xuống qua rừng thông, nhập thành một dòng sông rộng dần ở phần dưới khung', colors: ['#4A98D6', '#8AA6CF', '#5B7DB1', '#FFFFFF', '#7CC36A', '#5AA84C', '#3E9B4F', '#2F7A3A', '#8A5A2B', '#3FA7E0', '#8C8C94']}
  - {id: A-KINH-LUP, kind: icon, description: 'Kính lúp tay cầm vàng, mắt kính tròn trong suốt viền vàng dày; bên trong phóng to dòng nước có đúng 3 hạt muối thưa', colors: ['#FFC907', '#FFFFFF']}
  - {id: A-BAN-DO-SONG, kind: scene, description: 'Bản đồ phong cảnh nhìn từ trên cao, khung dọc: đất liền xanh lá có rừng và dãy núi nâu ở trên, 5 con sông xanh nhạt từ nhiều phía chảy xuống đổ về vùng biển xanh ở 1/3 dưới (bờ cát vàng); trên mỗi sông có chuỗi chấm trắng (muối)', colors: ['#7CC36A', '#5AA84C', '#3E9B4F', '#8A5A2B', '#6B4A2E', '#3FA7E0', '#1F7FC4', '#145A9E', '#F2D49B', '#FFFFFF']}
  - {id: A-SANG-BIEN, kind: diagram, description: 'Lớp sáng trắng mờ phủ đúng vùng biển của bản đồ, dùng để nhấp nháy chậm khi nói tất cả các dòng sông', colors: ['#FFFFFF']}
  - {id: A-MAT-TROI, kind: illustration, description: 'Mặt trời tròn vàng với 8 tia ngắn bo tròn', colors: ['#FFC907']}
  - {id: A-HOI-NUOC, kind: diagram, description: 'Các chấm hơi nước trắng nhỏ bay lên theo 3 mũi tên chấm chấm hướng lên; không có hạt muối nào trong luồng bay lên', colors: ['#FFFFFF']}
  - {id: A-MUOI-O-LAI, kind: icon, description: 'Hàng hạt muối lập phương trắng nằm lại dưới mặt nước biển, lấp lánh nhẹ', colors: ['#FFFFFF']}
  - {id: A-VONG-TUAN-HOAN, kind: diagram, description: 'Vòng tròn 4 chặng nối bằng mũi tên vàng cong chạy theo chiều kim đồng hồ: mưa (giọt trắng) → đá → sông → biển → mây; mỗi chặng là icon trắng đơn giản', colors: ['#FFC907', '#FFFFFF']}
  - {id: A-DAY-BIEN, kind: scene, description: 'Mặt cắt đáy biển thật, khung dọc: mặt nước ở trên, nước xanh đậm dần xuống sâu, tia sáng mờ từ mặt nước, đáy cát và đá nâu xám; ở 1/3 dưới là núi lửa đá tối có miệng dung nham cam vàng phát sáng, bên phải một ống khe nứt nhiệt toả vệt nhiệt vàng (chưa có khoáng chất — xem A-KHOANG-CHAT)', colors: ['#1F7FC4', '#145A9E', '#0A2A66', '#E3BC78', '#6B4A2E', '#5E5E66', '#8C8C94', '#FF7A2F', '#FFC907', '#FFFFFF', '#5E270E']}
  - {id: A-KHOANG-CHAT, kind: diagram, description: 'Chuỗi chấm khoáng chất trắng nhỏ bay lên từ miệng núi lửa và khe nứt, toả dần vào làn nước', colors: ['#FFFFFF']}
  - {id: A-MUI-TEN, kind: icon, description: 'Mũi tên dọc dày bo tròn màu vàng, chỉ xuống (chuỗi tóm tắt xếp từ trên xuống)', colors: ['#FFC907']}
  - {id: A-NUT-DANG-KY, kind: ui, description: 'Nút bo tròn lớn màu vàng, chữ "ĐĂNG KÝ" màu tối đậm ở giữa, tự thiết kế — không dùng logo YouTube', colors: ['#FFC907', '#5E270E']}
  - {id: A-CHUONG, kind: icon, description: 'Chuông thông báo trắng phẳng, có 2 vạch rung nhỏ hai bên', colors: ['#FFFFFF']}
  - {id: A-KHI-THAC-MAC, kind: mascot, expression: tham-hoi, description: 'Khỉ chống cằm thắc mắc, có dấu hỏi xanh — nêu nghịch lý mở đầu', colors: ['#FFC907', '#5E270E', '#0078E0']}
  - {id: A-KHI-NGAC-NHIEN, kind: mascot, expression: ngac-nhien, description: 'Khỉ ôm má ngạc nhiên, dấu chấm than cam — lúc lộ đáp án nước bay đi muối ở lại', colors: ['#FFC907', '#5E270E', '#FD8305']}
  - {id: A-KHI-TRAI-DAT, kind: mascot, expression: yeu-trai-dat, description: 'Khỉ ôm quả địa cầu — quy mô hàng triệu năm của hành tinh', colors: ['#FFC907', '#5E270E', '#669F2D']}
  - {id: A-KHI-VUI-MUNG, kind: mascot, expression: vui-mung, description: 'Khỉ giơ hai tay vui mừng — cảnh kết mời đăng ký', colors: ['#FFC907', '#5E270E', '#0078E0']}
  - {id: A-KHI-LOGO, kind: mascot, expression: logo, description: 'Logo tròn Khỉ Khám Phá có bảng tên gỗ — cảnh kết', colors: ['#FFC907', '#5E270E', '#0078E0', '#669F2D']}
shots:
  # ---------------- S01 Móc ----------------
  - id: S01-01-a
    segment: S01-01
    span: [0, 0.39]
    purpose: Thấy dòng sông nước ngọt đổ ra biển — vế đầu của nghịch lý
    background: '#0B3D91'
    focal: e1
    camera: {move: pan_down, amount: 0.1}
    transition_in: cut
    elements:
      - {id: e1, asset: A-CUA-SONG, box: {x: 0, y: 0, w: 100, h: 100}, enter: {anim: fade, at: 0, dur_s: 0.6, ease: ease_out}, loop: {anim: flow}}
    notes: Một cảnh cửa sông duy nhất — gợn sóng trôi xuôi dòng từ trên xuống (flow), lớp waves dập dềnh (bob 2,5 s); cửa sông ở khoảng 65% chiều cao; camera lia xuống theo dòng chảy.
  - id: S01-01-b
    segment: S01-01
    span: [0.39, 1]
    purpose: Đặt hai cốc cạnh nhau — sông ngọt, biển mặn — rồi bật câu hỏi
    background: '#0B3D91'
    focal: e3
    camera: {move: static}
    transition_in: zoom_through
    elements:
      - {id: e1, asset: A-COC-SONG, box: {x: 8, y: 14, w: 30, h: 20.6}, enter: {anim: pop, at: 0, dur_s: 0.4, ease: back_out}}
      - {id: e2, asset: A-COC-BIEN, box: {x: 8, y: 40, w: 30, h: 20.6}, enter: {anim: pop, at: 0.15, dur_s: 0.4, ease: back_out}}
      - {id: e3, asset: A-KHI-THAC-MAC, box: {x: 46, y: 29, w: 34, h: 19.1}, enter: {anim: pop, at: 0.6, dur_s: 0.35, ease: back_out}, loop: {anim: bob}}
      - {id: e4, text: "Sông ngọt,\nbiển mặn?", style: title, font_px: 96, color: '#FFC907', box: {x: 7, y: 63, w: 76, h: 12}, enter: {anim: fade, at: 0.38, dur_s: 0.3, ease: ease_out}}
    sfx:
      - {name: pop, target: e3, event: enter}
    notes: Zoom xuyên qua mặt biển của khung trước để vào khung hai cốc. Cốc biển hơi nghiêng để thấy hạt muối.
  - id: S01-02-a
    segment: S01-02
    span: [0, 1]
    purpose: Giữ câu hỏi thêm 1 giây cho người xem tự đoán
    background: '#0B3D91'
    focal: e3
    camera: {move: zoom_in, amount: 0.05}
    transition_in: match_cut
    elements:
      - {id: e1, asset: A-COC-SONG, box: {x: 8, y: 14, w: 30, h: 20.6}}
      - {id: e2, asset: A-COC-BIEN, box: {x: 8, y: 40, w: 30, h: 20.6}}
      - {id: e3, asset: A-KHI-THAC-MAC, box: {x: 46, y: 29, w: 34, h: 19.1}, loop: {anim: wiggle}}
      - {id: e4, text: "Sông ngọt,\nbiển mặn?", style: title, font_px: 96, color: '#FFC907', box: {x: 7, y: 63, w: 76, h: 12}, exit: {anim: fade, at: 1, dur_s: 0.3, ease: ease_in}}
    notes: Nối tiếp liền mạch với S01-01-b (không thấy vết cắt); chỉ dấu hỏi lắc và camera tiến nhẹ.
  # ---------------- S02 Mưa và đá ----------------
  - id: S02-01-a
    segment: S02-01
    span: [0, 1]
    purpose: Giọt mưa hút khí từ không khí và trở nên hơi chua
    background: '#0B3D91'
    focal: e2
    camera: {move: pan_down, amount: 0.1}
    transition_in: crossfade
    elements:
      - {id: e0, asset: A-NEN-MUA, box: {x: 0, y: 0, w: 100, h: 100}}
      - {id: e1, asset: A-MAY, box: {x: 18, y: 12, w: 50, h: 11.1}, enter: {anim: fade, at: 0, dur_s: 0.4, ease: ease_out}}
      - {id: e2, asset: A-GIOT-MUA, box: {x: 36, y: 26, w: 14, h: 13.1}, enter: {anim: drop, at: 0.05, dur_s: 0.6, ease: ease_in}}
      - {id: e3, asset: A-PHANTU-KHI, box: {x: 2, y: 28, w: 28, h: 10.5}, enter: {anim: slide_right, at: 0.35, dur_s: 0.7, ease: ease_in_out}, exit: {anim: scale_out, at: 0.6, dur_s: 0.3}}
      - {id: e4, asset: A-GIOT-MUA-CHUA, box: {x: 36, y: 26, w: 14, h: 13.1}, enter: {anim: morph, at: 0.62, dur_s: 0.4, ease: ease_out}, loop: {anim: pulse}}
      - {id: e5, text: 'axit nhẹ', style: label, font_px: 64, color: '#FFC907', box: {x: 52, y: 30, w: 30, h: 6.5}, enter: {anim: fade, at: 0.68, dur_s: 0.3}}
    notes: Phân tử khí bay vào trong giọt mưa rồi biến mất; giọt mưa trắng biến hình (morph) thành giọt viền vàng đúng lúc nói "hơi chua".
  - id: S02-02-a
    segment: S02-02
    span: [0, 0.35]
    purpose: Giọt mưa chua rơi xuống và chảy trên mặt đá
    background: '#0B3D91'
    focal: e1
    camera: {move: static}
    transition_in: push_up
    elements:
      - {id: e0, asset: A-NEN-MUA, box: {x: 0, y: 0, w: 100, h: 100}}
      - {id: e1, asset: A-DA, box: {x: 10, y: 48, w: 80, h: 19}, enter: {anim: slide_up, at: 0, dur_s: 0.5, ease: ease_out}}
      - {id: e2, asset: A-GIOT-MUA-CHUA, box: {x: 45.6, y: 16, w: 10, h: 9.4}, enter: {anim: drop, at: 0.1, dur_s: 0.6, ease: ease_in}, loop: {anim: flow}}
    notes: Nhiều giọt mưa chua (cùng asset) rơi liên tục và chảy thành vệt dọc sườn đá.
  - id: S02-02-b
    segment: S02-02
    span: [0.35, 1]
    purpose: Cận cảnh — nước làm bong hạt li ti khỏi đá, trong đó có muối
    background: '#0B3D91'
    focal: e2
    camera: {move: zoom_in, amount: 0.25}
    transition_in: match_cut
    elements:
      - {id: e0, asset: A-NEN-MUA, box: {x: 0, y: 0, w: 100, h: 100}}
      - {id: e1, asset: A-DA, box: {x: -10, y: 42, w: 120, h: 28.4}}
      - {id: e2, asset: A-HAT-MUOI, box: {x: 36, y: 41, w: 30, h: 7.7}, enter: {anim: grow, at: 0.15, dur_s: 0.8, ease: ease_out}, loop: {anim: shimmer}}
      - {id: e3, text: muối, style: label, font_px: 72, color: '#FFC907', box: {x: 56, y: 28, w: 24, h: 7}, enter: {anim: pop, at: 0.45, dur_s: 0.3, ease: back_out}}
    sfx:
      - {name: lách tách nhẹ, target: e2, event: enter}
    notes: Zoom vào vết nứt chính trên đỉnh đá (hạt muối nằm ngay miệng vết nứt); hạt li ti bong ra theo dòng nước, vài hạt sáng lên thành hình lập phương muối khi nói "trong đó có muối".
  - id: S02-03-a
    segment: S02-03
    span: [0, 1]
    purpose: Hạt muối theo dòng nước trôi đi — chuẩn bị sang chặng sông
    background: '#0B3D91'
    focal: e2
    camera: {move: pan_right, amount: 0.15}
    transition_in: match_cut
    elements:
      - {id: e0, asset: A-NEN-MUA, box: {x: 0, y: 0, w: 100, h: 100}}
      - {id: e1, asset: A-DA, box: {x: -10, y: 42, w: 120, h: 28.4}}
      - {id: e2, asset: A-HAT-MUOI, box: {x: 36, y: 41, w: 30, h: 7.7}, enter: {anim: slide_right, at: 0, dur_s: 1.0, ease: ease_in_out}}
    sfx:
      - {name: nước chảy róc rách, target: e2, event: enter}
    notes: Camera và hạt muối cùng trôi sang phải, rời khỏi đá theo dòng nước để nối sang cảnh suối.
  # ---------------- S03 Sông chở muối ----------------
  - id: S03-01-a
    segment: S03-01
    span: [0, 0.35]
    purpose: Nước mưa gom thành suối rồi thành sông
    background: '#0B3D91'
    focal: e1
    camera: {move: zoom_out, amount: 0.2}
    transition_in: crossfade
