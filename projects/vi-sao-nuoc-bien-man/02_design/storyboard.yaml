    notes: Cảnh hiện sẵn; chỉ lớp streams được vẽ dần (draw) từ trên núi xuống rồi chảy liên tục.
  - id: S03-01-b
    segment: S03-01
    span: [0.35, 1]
    purpose: Kính lúp cho thấy sông chỉ mang rất ít muối
