  fix: 'Viết lại goal thành kết quả cụ thể, ví dụ: "Sau 30 giây, người xem giải thích lại được bằng một câu: ánh sáng xanh có bước sóng ngắn nên bị không khí tán xạ mạnh hơn, lan khắp bầu trời; và muốn xem tiếp kênh."'
