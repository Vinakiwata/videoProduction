meta:
  title: Vì sao bầu trời có màu xanh
  language: vi
  target_duration_s: 30
  audience: Học sinh trung học và người lớn tò mò
  goal: Giải thích hiện tượng tán xạ Rayleigh bằng hình ảnh dễ hiểu
sources:
- id: SRC1
  title: NASA Space Place - Why is the sky blue?
  url: https://spaceplace.nasa.gov/blue-sky/
  accessed: '2026-11-27'
scenes:
- id: S01
  title: Mở đầu
  purpose: Đặt câu hỏi gây tò mò
  segments:
  - id: S01-01
    kind: voice
    text: Bạn có bao giờ tự hỏi vì sao bầu trời lại có màu xanh không?
    est_duration_s: 4
    visual: Bầu trời xanh, dấu chấm hỏi lớn bật ra
  - id: S01-02
    kind: silent
    est_duration_s: 1
    visual: Dấu chấm hỏi xoay nhẹ, tiếng "pop"
- id: S02
  title: Giải thích
  purpose: Trình bày tán xạ Rayleigh
  segments:
  - id: S02-01
    kind: voice
    text: Ánh sáng Mặt Trời là hỗn hợp của nhiều màu, mỗi màu có bước sóng khác nhau.
    est_duration_s: 6
    visual: 'Tia sáng trắng tách thành dải màu; mỗi màu là một đường sóng: đỏ sóng dài và thưa, xanh sóng ngắn và dày, nhãn chữ ''bước sóng'' chỉ vào khoảng cách hai đỉnh sóng'
  - id: S02-02
    kind: voice
    text: Khi đi qua khí quyển, ánh sáng xanh bước sóng ngắn bị các phân tử khí làm bật tung ra mọi hướng.
    est_duration_s: 7
    visual: Tia xanh dội lệch nhiều lần giữa các phân tử khí, đặt cạnh tia đỏ đi gần như thẳng để người xem thấy xanh bị dội nhiều hơn
    source_ids:
    - SRC1
  - id: S02-03
    kind: silent
    est_duration_s: 1
    visual: Tia xanh toả ra khắp khung hình, tia đỏ đi thẳng ra rìa
    sfx:
    - whoosh nhẹ
- id: S03
  title: Kết
  purpose: Chốt ý và kêu gọi
  segments:
  - id: S03-01
    kind: voice
    text: Thế nên ánh sáng xanh phủ kín bầu trời, và nhìn đâu ta cũng thấy màu xanh.
    est_duration_s: 5
    visual: 'Thu nhỏ về toàn cảnh: Trái Đất với lớp khí quyển phát sáng xanh, mũi tên tia xanh toả khắp'
    source_ids:
    - SRC1
  - id: S03-02
    kind: voice
    text: Đăng ký kênh để cùng khám phá thêm những hiện tượng khoa học quanh ta nhé!
    est_duration_s: 5
    visual: 'Nút đăng ký màu #FFD23F bật lên giữa nền trời xanh #0B3D91, có hiệu ứng nảy nhẹ'
    sfx:
    - click
