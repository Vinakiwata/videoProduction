notes: 'Bộ nhận diện do chủ dự án cung cấp ngày 28/11/2026 (ảnh tổng 1536x1024, tên file cho thấy tạo bằng ChatGPT). Linh vật cắt từ ảnh tổng: mỗi biểu cảm gốc chỉ khoảng 150–200 px, đã phóng lên 512 px, nên chỉ đặt Khỉ ở cỡ vừa (≤ 30% chiều cao khung); nên thay bằng ảnh gốc độ phân giải cao khi có. Vì hình tạo bằng AI, phải gắn nhãn nội dung AI khi đăng (Luật AI 134/2025/QH15), cùng với nhãn giọng AI. Màu đo tương phản: chữ trắng trên xanh dương #0078E0 chỉ 4,41:1 nên mọi chữ đặt trên tấm nền. Khung giải thích nền xanh đậm #0B3D91, chủ dự án chọn sau khi so sánh với nền nâu gỗ (28/11/2026). Giọng (28/11/2026): Xuân Vĩnh nâng +2,5 nửa cung (rubberband, dịch formant) cho giống bạn nam ~15 tuổi; chủ dự án chọn sau khi nghe 9 giọng và 4 mức tông. Tốc độ đọc cần hiệu chỉnh lại sau lần tạo giọng đầu tiên. Văn phong (28/11/2026): sau khi thử bản dí dỏm, chủ dự án chọn lời văn nghiêm túc vừa phải.'
